{{- if and ( .Values.grafana.dashboard ) ( .Values.grafana.dashboard.enabled ) }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: crossplane-dashboard
  namespace: {{ .Values.grafana.namespace | default (include "crossplane-observability.namespace" .) }}
  labels:
    grafana_dashboard: "true"
    grafanaDashboard: grafana-operator
    {{- include "crossplane-observability.labels" . | nindent 4 }}
spec:
  folder: {{ .Values.grafana.folder }}
  allowCrossNamespaceImport: {{ .Values.grafana.allowCrossNamespaceImport }}
  instanceSelector:
    {{ toYaml .Values.grafana.instanceSelector | nindent 3 }}
  datasources:
    {{ toYaml .Values.grafana.datasources | nindent 3 }}
  json: |-
{{ .Files.Get "files/crossplane_grafana_dashboard.json" | indent 4 }}
{{- end }}
