{{- $r := .Values.prometheus.rules.metallb.addressPoolExhausted }}
{{- if and ($r) ($r.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: metallb-address-pool-exhausted
  namespace: {{ include "metallb-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "metallb-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: metallb.allocation
      rules:
        - alert: MetalLBAddressPoolExhausted
          expr: |
            metallb_allocator_addresses_in_use_total >= metallb_allocator_addresses_total
            and metallb_allocator_addresses_total > 0
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: metallb
          annotations:
            summary: "MetalLB address pool {{`{{ $labels.pool }}`}} is exhausted"
            description: "Pool {{`{{ $labels.pool }}`}} has no free IPs ({{`{{ $value }}`}} in use). Every new LoadBalancer Service assigned to it stays <pending> with no error visible to the service owner. Extend the pool's address range or free allocations."
{{- end }}
