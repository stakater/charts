# promtool unit tests for mto-observability rule LOGIC (Tier 2 — generic
# operator health). Runs against tests/.rendered/rules.yaml (all groups merged,
# chart-default values: job labels mto-{tenant,finops,hibernation,template}-operator,
# reconcile error ratio 0.10 over 15m, workqueue depth 50 over 15m, webhook p99 1s).
rule_files:
  - ../.rendered/rules.yaml

evaluation_interval: 1m

tests:
  # ------------------------------------------------ operator down: up == 0
  - interval: 1m
    input_series:
      - series: 'up{job="mto-finops-operator", pod="finops-0", control_plane="controller-manager"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 7m
        alertname: MTOFinopsOperatorDown
        exp_alerts:
          - exp_labels:
              severity: critical
              rulesgroup: mto
              job: mto-finops-operator
              pod: finops-0
              control_plane: controller-manager
            exp_annotations:
              summary: "finops-operator is down or not being scraped"
              description: "No metrics from job mto-finops-operator (pod finops-0, controller controller-manager) for 5m: the pod is down, crash-looping, or the scrape is broken. Its controllers are not reconciling, and while its Fail-policy admission webhooks are unreachable the writes they guard are rejected cluster-wide. Check the pods in the operator namespace and the PodMonitor's target status."

  # ------------------------------------------------ operator down: resolves
  - interval: 1m
    input_series:
      - series: 'up{job="mto-finops-operator", pod="finops-0", control_plane="controller-manager"}'
        values: '0x9 1x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: MTOFinopsOperatorDown
        exp_alerts: []

  # ---------------------------------- operator down: absent() half (no series at all)
  # No hibernation series exist in this test; absent(up{job=...}) carries the
  # equality matcher's labels.
  - interval: 1m
    input_series:
      - series: 'up{job="mto-tenant-operator", pod="tenant-0", control_plane="controller-manager-tenant"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 7m
        alertname: MTOHibernationOperatorDown
        exp_alerts:
          - exp_labels:
              severity: critical
              rulesgroup: mto
              job: mto-hibernation-operator
            exp_annotations:
              summary: "hibernation-operator is down or not being scraped"
              description: "No metrics from job mto-hibernation-operator (pod , controller ) for 5m: the pod is down, crash-looping, or the scrape is broken. Its controllers are not reconciling, and while its Fail-policy admission webhooks are unreachable the writes they guard are rejected cluster-wide. Check the pods in the operator namespace and the PodMonitor's target status."
      - eval_time: 7m
        alertname: MTOTenantOperatorDown
        exp_alerts: []

  # ------------------------------------------------ reconcile error ratio
  # 2 errors/min of 10 reconciles/min = 20% > 10% for 15m -> fires; errors
  # stopping resolves it.
  - interval: 1m
    input_series:
      - series: 'controller_runtime_reconcile_errors_total{job="mto-finops-operator", controller="costjob"}'
        values: '0+2x40'
      - series: 'controller_runtime_reconcile_total{job="mto-finops-operator", controller="costjob"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: MTOFinopsOperatorReconcileErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              rulesgroup: mto
              controller: costjob
            exp_annotations:
              summary: "finops-operator controller costjob is failing reconciles"
              description: "More than 10% of costjob reconciles errored over the last 15m (current ratio 20%). The resources this controller owns are not converging; its logs name the failing object."
  - interval: 1m
    input_series:
      - series: 'controller_runtime_reconcile_errors_total{job="mto-finops-operator", controller="costjob"}'
        values: '0x45'
      - series: 'controller_runtime_reconcile_total{job="mto-finops-operator", controller="costjob"}'
        values: '0+10x45'
    alert_rule_test:
      - eval_time: 40m
        alertname: MTOFinopsOperatorReconcileErrors
        exp_alerts: []

  # ------------------------------------------------ workqueue backlog
  - interval: 1m
    input_series:
      - series: 'workqueue_depth{job="mto-tenant-operator", name="tenant"}'
        values: '100x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: MTOTenantOperatorWorkqueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              rulesgroup: mto
              name: tenant
            exp_annotations:
              summary: "tenant-operator workqueue tenant is backing up"
              description: "Queue tenant has held more than 50 items for 15m (currently 100). Work is arriving faster than the controller drains it — tenants see slow convergence before anything errors."
  - interval: 1m
    input_series:
      - series: 'workqueue_depth{job="mto-tenant-operator", name="tenant"}'
        values: '100x5 0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: MTOTenantOperatorWorkqueueBacklog
        exp_alerts: []

  # ------------------------------------------------ webhook 5xx
  - interval: 1m
    input_series:
      - series: 'controller_runtime_webhook_requests_total{job="mto-tenant-operator", webhook="/validate-tenant", code="500"}'
        values: '0+5x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: MTOTenantOperatorWebhookErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              rulesgroup: mto
              webhook: /validate-tenant
            exp_annotations:
              summary: "tenant-operator webhook /validate-tenant is returning 5xx"
              description: "Admission webhook /validate-tenant has returned 5xx for 10m. For Fail-policy webhooks these are user-visible rejections of the writes they guard; for Ignore-policy ones the requests pass unvalidated instead."
  - interval: 1m
    input_series:
      - series: 'controller_runtime_webhook_requests_total{job="mto-tenant-operator", webhook="/validate-tenant", code="500"}'
        values: '0+5x10 50x40'
    alert_rule_test:
      - eval_time: 45m
        alertname: MTOTenantOperatorWebhookErrors
        exp_alerts: []

  # ------------------------------------------------ webhook latency p99
  # Every request lands between 1s and 5s -> p99 ~ 5s > 1s; requests moving
  # into the <=1s bucket resolves it.
  - interval: 1m
    input_series:
      - series: 'controller_runtime_webhook_latency_seconds_bucket{job="mto-finops-operator", webhook="/validate-offering", le="1"}'
        values: '0x30'
      - series: 'controller_runtime_webhook_latency_seconds_bucket{job="mto-finops-operator", webhook="/validate-offering", le="5"}'
        values: '0+10x30'
      - series: 'controller_runtime_webhook_latency_seconds_bucket{job="mto-finops-operator", webhook="/validate-offering", le="+Inf"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: MTOFinopsOperatorWebhookLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              rulesgroup: mto
              webhook: /validate-offering
            exp_annotations:
              summary: "finops-operator webhook /validate-offering is slow"
              description: "p99 admission latency of /validate-offering has been above 1s for 10m (currently 4.959999999999999s). The webhook sits in the write path of the requests it guards — its latency is every caller's latency."
  - interval: 1m
    input_series:
      - series: 'controller_runtime_webhook_latency_seconds_bucket{job="mto-finops-operator", webhook="/validate-offering", le="1"}'
        values: '0+10x30'
      - series: 'controller_runtime_webhook_latency_seconds_bucket{job="mto-finops-operator", webhook="/validate-offering", le="5"}'
        values: '0+10x30'
      - series: 'controller_runtime_webhook_latency_seconds_bucket{job="mto-finops-operator", webhook="/validate-offering", le="+Inf"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: MTOFinopsOperatorWebhookLatencyHigh
        exp_alerts: []
