{{- if and (.Values.prometheus.monitors.frrK8sPodMonitor) (.Values.prometheus.monitors.frrK8sPodMonitor.enabled) }}
{{- $m := .Values.prometheus.monitors.frrK8sPodMonitor }}
# Scrapes the FRR-K8s daemon — the BGP/BFD metric source in FRR-K8s mode. The raw metrics
# ports (7572 frr-k8s controller, 7573 frr translator) bind 127.0.0.1 only (captured), so
# the only scrapeable surface is the two kube-rbac-proxy TLS sidecars. One endpoint per
# port NAME: the OpenShift operator names them `metricshttps` (9140) + `frrmetricshttps`
# (9141); upstream names both `metricshttps`, where a single entry yields two targets per
# pod. Auth: bearer token, authorized by SubjectAccessReview against GET /metrics (see the
# metrics-reader RBAC). On the operator FRR-K8s runs in its own namespace
# (metallb.frrk8s.namespace), which only the platform Prometheus can select across —
# the operator already scrapes it there (metallb.operatorManagedMonitors), so this stays off.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "metallb-observability.fullname" . }}-frr-k8s
  namespace: {{ include "metallb-observability.namespace" . }}
  labels:
    {{- include "metallb-observability.labels" . | nindent 4 }}
spec:
  {{- with .Values.metallb.frrk8s.namespace }}
  namespaceSelector:
    matchNames:
      - {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- toYaml .Values.metallb.frrk8s.selector | nindent 6 }}
  podMetricsEndpoints:
    {{- range $port := $m.ports }}
    - port: {{ $port }}
      path: /metrics
      scheme: https
      interval: {{ $m.interval }}
      scrapeTimeout: {{ $m.scrapeTimeout }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "metallb-observability.fullname" $ }}-metrics-reader-token
          key: token
      tlsConfig:
        insecureSkipVerify: {{ $m.tls.insecureSkipVerify }}
      relabelings:
        - action: replace
          replacement: {{ $.Values.metallb.frrk8s.job | quote }}
          targetLabel: job
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
    {{- end }}
{{- end }}
