{{- $r := .Values.prometheus.rules.fleet.claimNotReady }}
{{- if and $r $r.enabled .Values.crossplane.inventory.enabled }}
{{- $metric := .Values.crossplane.inventory.claimReadyMetric }}
# Story 4.1 — a customer's Claim is not Ready. Claims/Composites are NOT covered by the
# provider leaf-MR metrics; this comes from an inventory exporter (resource-state-metrics
# or KSM CustomResourceState — see docs/resource-state-metrics-example.yaml), which emits a
# per-claim 1/0 gauge with group/version/kind/name/namespace labels. Unlike the leaf metrics
# this carries `namespace`, so alerts and SLOs are per-tenant.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crossplane-claim-not-ready
  namespace: {{ include "crossplane-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "crossplane-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: crossplane.fleet
      rules:
        - alert: ClaimNotReady
          expr: {{ $metric }} == 0
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: crossplane
          annotations:
            summary: "Claim {{`{{ $labels.kind }}/{{ $labels.name }}`}} not ready"
            description: "Claim {{`{{ $labels.kind }}/{{ $labels.name }}`}} in namespace {{`{{ $labels.namespace }}`}} has been not-ready for more than {{ $r.for }} — the customer's end-to-end request is not satisfied."
{{- end }}
