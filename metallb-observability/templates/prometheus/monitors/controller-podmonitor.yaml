{{- if and (.Values.prometheus.monitors.controllerPodMonitor) (.Values.prometheus.monitors.controllerPodMonitor.enabled) }}
{{- $m := .Values.prometheus.monitors.controllerPodMonitor }}
# Scrapes the MetalLB controller (allocator + k8s-client metrics) on the plain-HTTP
# `monitoring` container port (7472, captured). No metrics Service exists in either the
# upstream chart or the operator install, hence a PodMonitor. The job label is pinned by
# relabeling so rules and dashboard don't depend on the release name.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "metallb-observability.fullname" . }}-controller
  namespace: {{ include "metallb-observability.namespace" . }}
  labels:
    {{- include "metallb-observability.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.metallb.controller.selector | nindent 6 }}
  podMetricsEndpoints:
    - port: {{ $m.port }}
      path: /metrics
      scheme: http
      interval: {{ $m.interval }}
      scrapeTimeout: {{ $m.scrapeTimeout }}
      relabelings:
        - action: replace
          replacement: {{ $m.job | quote }}
          targetLabel: job
{{- end }}
