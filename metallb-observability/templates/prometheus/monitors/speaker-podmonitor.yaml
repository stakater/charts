{{- if and (.Values.prometheus.monitors.speakerPodMonitor) (.Values.prometheus.monitors.speakerPodMonitor.enabled) }}
{{- $m := .Values.prometheus.monitors.speakerPodMonitor }}
# Scrapes every speaker (k8s-client metrics, plus the lazily-registered
# metallb_speaker_announced / metallb_layer2_* on whichever speaker currently announces a
# service) on the plain-HTTP `monitoring` container port (7472, captured). The speaker is
# hostNetwork and binds its node IP — the PodMonitor scrapes the pod IP (= node IP), which
# works; localhost does not.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "metallb-observability.fullname" . }}-speaker
  namespace: {{ include "metallb-observability.namespace" . }}
  labels:
    {{- include "metallb-observability.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.metallb.speaker.selector | nindent 6 }}
  podMetricsEndpoints:
    - port: {{ $m.port }}
      path: /metrics
      scheme: http
      interval: {{ $m.interval }}
      scrapeTimeout: {{ $m.scrapeTimeout }}
      relabelings:
        - action: replace
          replacement: {{ $m.job | quote }}
          targetLabel: job
        # per-node signal: carry the node name on every speaker series
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
{{- end }}
