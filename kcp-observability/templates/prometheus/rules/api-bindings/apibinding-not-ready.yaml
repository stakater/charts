{{- $r := .Values.prometheus.rules.apiBindings.notReady }}
{{- if and ($r) ($r.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-apibinding-not-ready
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.api_bindings
      rules:
        - alert: KcpAPIBindingNotReady
          expr: |
            {{- /* max over replicas: only the controller-leader has the full index (per-replica gauges disagree) */}}
            sum by (shard) (max by (shard, status) (kcp_apibinding_condition_status{condition="Ready", status=~"False|Unknown"})) > 0
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "{{`{{ $value }}`}} APIBindings not Ready on shard {{`{{ $labels.shard }}`}}"
            description: "A tenant's bound API silently disappears when its APIBinding degrades — their kubectl just stops listing the resource. Find the bindings via the kcp API."
{{- end }}
