# Story 4.2 (PHASE 2) — multi-tenant protection: a single XR thrashing (reconcile storm)
# can saturate the control plane and starve other tenants. The circuit-breaker mechanism
# runs on 2.1.x, but its Prometheus metrics are guaranteed only after the 2.2/2.3 upgrade
# (confirm-on-build). Thresholds are the upstream-published values, used verbatim.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crossplane-circuit-breaker
  namespace: default
  labels:
    role: alert-rules
    helm.sh/chart: crossplane-observability-0.0.1
    app.kubernetes.io/name: crossplane-observability
    app.kubernetes.io/instance: cp
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: crossplane.fleet
      rules:
        - alert: CircuitBreakerDropRatioHigh
          expr: |
            sum by (controller) (rate(circuit_breaker_events_total{job="crossplane", result="Dropped"}[5m]))
            /
            clamp_min(sum by (controller) (rate(circuit_breaker_events_total{job="crossplane"}[5m])), 1)
            > 0.2
          for: 5m
          labels:
            severity: critical
            rulesgroup: crossplane
          annotations:
            summary: "Circuit breaker dropping events for {{ $labels.controller }}"
            description: "Controller {{ $labels.controller }} is dropping {{ $value | humanizePercentage }} of watch events (> 0.2) for more than 5m — a thrashing XR may be starving other tenants."
        - alert: CircuitBreakerFrequentOpens
          expr: |
            sum by (controller) (increase(circuit_breaker_opens_total{job="crossplane"}[1h])) > 6
          for: 15m
          labels:
            severity: warning
            rulesgroup: crossplane
          annotations:
            summary: "Circuit breaker opening frequently for {{ $labels.controller }}"
            description: "Controller {{ $labels.controller }} circuit breaker opened more than 6 times in the last hour (sustained 15m) — repeated reconcile storms."
