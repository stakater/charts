{{- $r := .Values.prometheus.rules.apiBindings.slow }}
{{- /* This alert's only input is the recorded series kcp:apibinding_ttr_ms:p95 —
       enabling it with recording rules disabled would ship an alert that can
       never fire (audit finding), so the gate requires both. */}}
{{- if and ($r) ($r.enabled) (.Values.prometheus.recordingRules.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-apibinding-slow
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.api_bindings
      rules:
        - alert: KcpAPIBindingSlow
          expr: |
            kcp:apibinding_ttr_ms:p95 > {{ $r.p95Ms }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "APIBinding p95 time-to-ready is {{`{{ $value }}`}}ms on shard {{`{{ $labels.shard }}`}}"
            description: "Slow binding is slow tenant onboarding — binding an API into a workspace is a core first-use step."
{{- end }}
