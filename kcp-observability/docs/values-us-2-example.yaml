# values override used for the us-2 deployment (deploy-validation reference).
#
# Prerequisite applied on us-2 (see docs/shard-metrics-cert-example.yaml): a cert-manager
# Certificate `kcp-metrics-scraper-cert` issued by the shard's `root-client-ca`
# (CN=kcp-metrics-scraper, O=system:kcp:admin) — verified HTTP 200 on shard /metrics.
# TODO(hardening): replace the admin group with a dedicated kcp RBAC binding for
# nonResourceURL /metrics only.

grafana:
  # The us-2 Grafana instance (grafana-operator) lives in crossplane-observability and
  # selects dashboards by this label — NOT the SAAP default app=grafana.
  instanceSelector:
    matchLabels:
      dashboards: crossplane

prometheus:
  monitors:
    shardServiceMonitor:
      enabled: true
      certSecret: kcp-metrics-scraper-cert
    frontProxyServiceMonitor:
      enabled: true
    etcdServiceMonitor:
      enabled: true
    syncAgentPodMonitor:
      enabled: true
