# DEMO ONLY: stand-ins for CronJob-based etcd backups so the dashboard's optional etcd
# panels have data. daily succeeds; weekly always fails (shows NEVER).
apiVersion: v1
kind: Namespace
metadata: {name: etcd-backup}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: daily-etcd-backup, namespace: etcd-backup}
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers: [{name: backup, image: "busybox:1.37", command: ["sh", "-c", "echo snapshot ok"]}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: weekly-etcd-backup, namespace: etcd-backup}
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers: [{name: backup, image: "busybox:1.37", command: ["sh", "-c", "echo upload failed; exit 1"]}]
