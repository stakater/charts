{{- $r := .Values.prometheus.rules.workspaces.stuck }}
{{- /* Input is a recorded kcp:* series: without recording rules this alert can
       never fire, so the gate requires both toggles (audit finding). */}}
{{- if and ($r) ($r.enabled) (.Values.prometheus.recordingRules.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-workspaces-stuck
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.workspaces
      rules:
        - alert: KcpWorkspacesStuck
          expr: |
            kcp:workspaces_not_ready:count > {{ $r.baseline }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "{{`{{ $value }}`}} kcp workspaces are not Ready on shard {{`{{ $labels.shard }}`}}"
            description: "Workspaces sitting in Scheduling/Initializing/Unavailable beyond the baseline are tenants who cannot work. kcp metrics carry counts by phase only — use the runbook to identify WHICH workspaces are stuck. Baseline is calibrated per cluster."
            runbook_url: "https://github.com/stakater/charts/blob/main/kcp-observability/docs/alerts-guide.md#runbook-identifying-stuck-workspaces-and-logical-clusters"
{{- end }}
