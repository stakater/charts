{{- $r := .Values.prometheus.rules.velero.backupStale }}
{{- if and ($r) ($r.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "oadp-observability.fullname" . }}-backup-stale
  namespace: {{ include "oadp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "oadp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: oadp.backup-outcome
      rules:
        - alert: OadpBackupStale
          # The OUTCOME, not a proxy: the newest Completed backup per schedule is
          # older than the RPO budget. The timestamp is recomputed every minute from live
          # Completed Backup CRs (Velero 1.16 backup_controller.go:157-181), so it survives
          # Velero restarts. When NO Completed backup exists the series is absent, so this
          # rule cannot fire; OadpBackupNoSuccessfulBackup covers that case.
          # max by: one series per schedule even while two Velero pods are scraped.
          expr: |
            time() - max by (namespace, schedule) (velero_backup_last_successful_timestamp{schedule!=""}) > {{ $r.maxAgeHours }} * 3600
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: oadp
          annotations:
            summary: "No successful Velero backup for schedule {{`{{ $labels.schedule }}`}} in over {{ $r.maxAgeHours }}h"
            description: "The newest Completed backup of schedule {{`{{ $labels.schedule }}`}} is {{`{{ $value | humanizeDuration }}`}} old (budget {{ $r.maxAgeHours }}h), so the cluster cannot be restored to within its RPO. Recent runs are failing or not running. First: oc -n {{`{{ $labels.namespace }}`}} get backups.velero.io -l velero.io/schedule-name={{`{{ $labels.schedule }}`}} --sort-by=.metadata.creationTimestamp; oc -n {{`{{ $labels.namespace }}`}} get backupstoragelocations.velero.io"
            runbook_url: "{{ .Values.prometheus.rules.runbookBaseURL }}#oadpbackupstale"
{{- end }}
