# Source: crossplane-observability/templates/prometheus/rules/resource-health/ttr-degraded.yaml
# Story 1.2 — resources are taking too long to become ready. Slow provisioning is a
# customer-visible SLA breach even when nothing has outright "failed". The native TTR
# metric covers all providers; on Upjet providers upjet_resource_ttr is more accurate
# for async resources (preferred when upjet.enabled).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crossplane-ttr-degraded
  namespace: default
  labels:
    role: alert-rules
    helm.sh/chart: crossplane-observability-0.0.1
    app.kubernetes.io/name: crossplane-observability
    app.kubernetes.io/instance: cp
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: crossplane.resource-health
      rules:
        - alert: TTRDegraded
          expr: |
            histogram_quantile(0.95, sum by (le, gvk) (
              rate(
                upjet_resource_ttr_bucket{job="crossplane-providers"}[30m]
              )
            )) > 300
          for: 30m
          labels:
            severity: warning
            rulesgroup: crossplane
          annotations:
            summary: "Slow provisioning for {{ $labels.gvk }} (p95 TTR over SLO)"
            description: "p95 time-to-readiness for {{ $labels.gvk }} is {{ $value | humanizeDuration }}, above the 300s SLO, for more than 30m."
---
# Source: crossplane-observability/templates/prometheus/monitors/core-servicemonitor.yaml
# Scrapes Crossplane core /metrics: controller-runtime (reconcile rate/latency,
# workqueue), the aggregated-API health, and — after the 2.2/2.3 upgrade — the
# circuit-breaker and composition/function-pipeline metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cp-crossplane-observability-core
  namespace: default
  labels:
    helm.sh/chart: crossplane-observability-0.0.1
    app.kubernetes.io/name: crossplane-observability
    app.kubernetes.io/instance: cp
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: crossplane
      app.kubernetes.io/instance: crossplane
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
