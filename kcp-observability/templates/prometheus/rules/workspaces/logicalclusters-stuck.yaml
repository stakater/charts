{{- $r := .Values.prometheus.rules.workspaces.logicalClustersStuck }}
{{- /* Input is a recorded kcp:* series: without recording rules this alert can
       never fire, so the gate requires both toggles (audit finding). */}}
{{- if and ($r) ($r.enabled) (.Values.prometheus.recordingRules.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-logicalclusters-stuck
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.workspaces
      rules:
        - alert: KcpLogicalClustersStuck
          expr: |
            kcp:logicalclusters_not_ready:count > {{ $r.baseline }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "{{`{{ $value }}`}} kcp logical clusters are not Ready on shard {{`{{ $labels.shard }}`}}"
            description: "Logical clusters (the per-workspace kcp primitive) stuck outside Ready. kcp v0.32.1 count gauges are UNRELIABLE in absolute terms (verified 2026-07-16: etcd truth 2 stuck logical clusters, metric said 10; replicas disagree with etcd and each other) — ALWAYS verify via the runbook before acting, which also identifies WHICH logical clusters are stuck. Baseline is calibrated per cluster (us-2 has a standing Scheduling count — SRE finding F2)."
            runbook_url: "https://github.com/stakater/charts/blob/main/kcp-observability/docs/alerts-guide.md#runbook-identifying-stuck-workspaces-and-logical-clusters"
{{- end }}
