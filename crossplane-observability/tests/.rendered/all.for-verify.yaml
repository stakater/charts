# Source: crossplane-observability/templates/prometheus/rules/cloud/cloud-api-throttling.yaml
# Story 6.1 — we are being throttled by the cloud provider. Throttling at the cloud SDK
# is the root cause behind many latency/TTR alerts and is upstream of us. Upjet providers
# only (gated on upjet.enabled). NEVER an SLA — the failure is upstream at the cloud provider.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crossplane-cloud-api-throttling
  namespace: default
  labels:
    role: alert-rules
    helm.sh/chart: crossplane-observability-0.0.1
    app.kubernetes.io/name: crossplane-observability
    app.kubernetes.io/instance: cp
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
    - name: crossplane.cloud
      rules:
        - alert: CloudAPIThrottling
          # A high reconcile delay means the provider is falling behind its poll cadence —
          # typically cloud-side rate limiting. Threshold is configurable (seconds); the
          # roadmap notes it should be calibrated against the providers' configured poll
          # interval rather than a fixed number.
          expr: |
            histogram_quantile(0.95, sum by (le, kind) (
              rate(upjet_resource_reconcile_delay_seconds_bucket{job="crossplane-providers"}[15m])
            )) > 60
          for: 15m
          labels:
            severity: warning
            rulesgroup: crossplane
          annotations:
            summary: "Cloud-API throttling suspected for {{ $labels.kind }}"
            description: "p95 reconcile delay for {{ $labels.kind }} is {{ $value | humanizeDuration }}, above the 60s threshold, for more than 15m — the provider is falling behind, typically due to cloud-provider rate limiting (upstream of Crossplane)."
