# e2e overlay: the UPSTREAM profile (helm-chart MetalLB: upstream pod labels, nothing
# scrapes it, frr-k8s in the same namespace with both proxy ports named metricshttps),
# all chart monitors on with pinned metallb-* jobs, fast scrape, and short alert windows
# so scenarios.sh can drive every alert to fire and resolve in minutes. Values not set
# here keep the chart defaults (severities, thresholds).
# Helm MERGES maps: the operator's `app`/`component` keys must be nulled out explicitly
# or the selectors would require both label sets and match nothing upstream.
metallb:
  operatorManagedMonitors: false
  controller:
    selector:
      app: null
      component: null
      app.kubernetes.io/name: metallb
      app.kubernetes.io/component: controller
    job: metallb-controller
  speaker:
    selector:
      app: null
      component: null
      app.kubernetes.io/name: metallb
      app.kubernetes.io/component: speaker
    job: metallb-speaker
  frrk8s:
    namespace: ""
    selector:
      app: null
      component: null
      app.kubernetes.io/name: frr-k8s
      app.kubernetes.io/component: frr-k8s
    job: metallb-frr-k8s
prometheus:
  monitors:
    controllerPodMonitor:
      enabled: true
      interval: 15s
    speakerPodMonitor:
      enabled: true
      interval: 15s
    frrK8sPodMonitor:
      enabled: true
      interval: 15s
      ports:
        - metricshttps
  rules:
    metallb:
      addressPoolExhausted:
        for: 1m
      addressPoolNearExhaustion:
        for: 1m
      bgpSessionDown:
        for: 1m
      bgpSessionFlapping:
        window: 5m
      bfdSessionDown:
        for: 1m
      configNotLoaded:
        for: 1m
      configStale:
        for: 1m
      controllerDown:
        for: 1m
      speakerDown:
        for: 1m
      frrK8sDown:
        for: 1m
    watchdog:
      metricsAbsent:
        for: 2m
