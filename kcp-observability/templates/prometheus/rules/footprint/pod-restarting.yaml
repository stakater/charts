{{- $r := .Values.prometheus.rules.footprint.podRestarting }}
{{- if and ($r) ($r.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-pod-restarting
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.footprint
      rules:
        - alert: KcpPodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ include "kcp-observability.namespace" . }}", pod=~"{{ .Values.kcp.podRegex }}"}[1h]) > {{ $r.threshold }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "kcp pod {{`{{ $labels.pod }}`}} restarted {{`{{ $value }}`}} times in the last hour"
            description: "A crash-looping control-plane component is both cause and symptom of an outage. NOTE: syncagents have a standing restart baseline on us-2 — calibrate before paging."
{{- end }}
