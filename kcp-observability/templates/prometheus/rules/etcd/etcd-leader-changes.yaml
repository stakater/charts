{{- $r := .Values.prometheus.rules.etcd.leaderChangesHigh }}
{{- if and ($r) ($r.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-etcd-leader-changes
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.etcd
      rules:
        - alert: KcpEtcdLeaderChangesHigh
          expr: |
            increase(etcd_server_leader_changes_seen_total{job=~"{{ .Values.kcp.etcd.job }}"}[1h]) > {{ $r.threshold }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "kcp etcd saw {{`{{ $value }}`}} leader changes in the last hour"
            description: "Frequent elections indicate disk or network trouble under etcd; expect intermittent write stalls."
{{- end }}
