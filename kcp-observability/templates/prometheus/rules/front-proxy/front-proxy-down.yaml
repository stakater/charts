{{- $r := .Values.prometheus.rules.frontProxy.down }}
{{- if and ($r) ($r.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-front-proxy-down
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.front_proxy
      rules:
        - alert: KcpFrontProxyDown
          expr: |
            up{job=~"{{ .Values.kcp.frontProxy.job }}"} == 0
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "kcp front-proxy target {{`{{ $labels.pod }}`}} is down"
            description: "The kcp front-proxy is the single entrypoint for every tenant. A down target means reduced or lost control-plane access for all workspaces."
{{- end }}
