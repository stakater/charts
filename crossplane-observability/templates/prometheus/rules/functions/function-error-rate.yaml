{{- $r := .Values.prometheus.rules.functions.functionErrorRate }}
{{- if and $r $r.enabled }}
# Story 5.1 (PHASE 2, part 2) — a composition function is erroring. Hidden function
# failures surface only as generic reconcile errors. Disabled by default. Error vs total
# splits on `result_severity="Fatal"` — the real label confirmed on a live build (the
# response-total metric has result_severity, not a `result="error"` label; validation
# proved the old filter never matched — see tests/reports).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crossplane-function-error-rate
  namespace: {{ include "crossplane-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "crossplane-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: crossplane.functions
      rules:
        - alert: FunctionErrorRate
          expr: |
            sum by (function_name) (rate(function_run_function_response_total{job="{{ .Values.crossplane.core.job }}", result_severity="Fatal"}[5m]))
            /
            clamp_min(sum by (function_name) (rate(function_run_function_response_total{job="{{ .Values.crossplane.core.job }}"}[5m])), 1)
            > {{ $r.threshold }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: crossplane
          annotations:
            summary: "Composition function {{`{{ $labels.function_name }}`}} error rate high"
            description: "Function {{`{{ $labels.function_name }}`}} error ratio is {{`{{ $value | humanizePercentage }}`}} (SLO < {{ $r.threshold }}) for more than {{ $r.for }}."
{{- end }}
