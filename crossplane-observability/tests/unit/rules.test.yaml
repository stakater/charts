# promtool unit tests — validate rule LOGIC against synthetic series.
#
# This proves the rules compute and fire as intended given known inputs (correct
# operator, label propagation, recording-rule → alert wiring). It does NOT prove the
# input metrics exist on the cluster — that is the job of capture-metrics.sh + the
# metric gate. Run with:  promtool test rules tests/unit/rules.test.yaml
#
# rule_files is the merged, Helm-rendered rule set produced by tests/validate.sh into
# tests/.rendered/rules.yaml (so we test exactly what the chart ships, not a copy).
rule_files:
  - ../.rendered/rules.yaml

evaluation_interval: 1m

tests:
  # --- Story 2.1: recording rule feeds the alert ---
  - name: reconcile error ratio recording rule + alert
    interval: 1m
    # Real `controller` label values are path-prefixed FQDNs — the test uses them verbatim so
    # the anchored-regex exclusion (N2) is actually exercised.
    input_series:
      - series: 'controller_runtime_reconcile_total{job="crossplane", controller="managed/instance.ec2.aws.upbound.io"}'
        values: '0+100x180'   # 100 reconciles/min
      - series: 'controller_runtime_reconcile_errors_total{job="crossplane", controller="managed/instance.ec2.aws.upbound.io"}'
        values: '0+50x180'    # 50 errors/min  -> ratio 0.5
      # An excluded internal controller (path-prefixed) with a worse ratio: must NOT page.
      - series: 'controller_runtime_reconcile_total{job="crossplane", controller="usage/clusterusage.protection.crossplane.io"}'
        values: '0+100x180'
      - series: 'controller_runtime_reconcile_errors_total{job="crossplane", controller="usage/clusterusage.protection.crossplane.io"}'
        values: '0+75x180'    # ratio 0.75, over threshold — but excluded by .*usage.*
    promql_expr_test:
      # Recording rule still records BOTH (visible on the dashboard)…
      - expr: crossplane:reconcile_errors:ratio
        eval_time: 120m
        exp_samples:
          - labels: 'crossplane:reconcile_errors:ratio{controller="managed/instance.ec2.aws.upbound.io"}'
            value: 0.5
          - labels: 'crossplane:reconcile_errors:ratio{controller="usage/clusterusage.protection.crossplane.io"}'
            value: 0.75
    alert_rule_test:
      # …but only the non-excluded controller pages.
      - eval_time: 120m
        alertname: ReconcileErrorRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              controller: managed/instance.ec2.aws.upbound.io
              rulesgroup: crossplane
            exp_annotations:
              summary: "High reconcile error ratio for controller managed/instance.ec2.aws.upbound.io"
              description: "Controller managed/instance.ec2.aws.upbound.io reconcile error ratio is 50% (SLO < 0.01) for more than 10m."

  # --- Story 1.1: MR ready-ratio recording rule + escalating alerts ---
  # State metrics are per-GVK counts labelled `gvk`: exists=total, ready=ready count.
  # 1 of 2 ready -> ratio 0.5, which is < both thresholds, so warning fires at 15m and
  # critical at 1h.
  - name: managed resource ready ratio escalation
    interval: 1m
    input_series:
      - series: 'crossplane_managed_resource_exists{job="crossplane-providers", gvk="example.org/v1, Kind=Thing"}'
        values: '2x180'
      - series: 'crossplane_managed_resource_ready{job="crossplane-providers", gvk="example.org/v1, Kind=Thing"}'
        values: '1x180'
      # An installed-but-empty CRD: exists=0, ready=0. Must NOT produce a ratio series and
      # must NOT fire (regression for the ~97% false-positive bug — see tests/reports).
      - series: 'crossplane_managed_resource_exists{job="crossplane-providers", gvk="example.org/v1, Kind=Empty"}'
        values: '0x180'
      - series: 'crossplane_managed_resource_ready{job="crossplane-providers", gvk="example.org/v1, Kind=Empty"}'
        values: '0x180'
    promql_expr_test:
      # Only the non-empty GVK has a ratio series; the empty GVK is excluded.
      - expr: crossplane:managed_resource_ready:ratio
        eval_time: 30m
        exp_samples:
          - labels: 'crossplane:managed_resource_ready:ratio{gvk="example.org/v1, Kind=Thing"}'
            value: 0.5
    alert_rule_test:
      - eval_time: 20m
        alertname: MRNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              gvk: "example.org/v1, Kind=Thing"
              rulesgroup: crossplane
            exp_annotations:
              summary: "Managed resources not all ready for example.org/v1, Kind=Thing"
              description: "Only 50% of example.org/v1, Kind=Thing managed resources are Ready (SLO 1) for more than 15m. Some infrastructure may exist but be unusable."
      - eval_time: 20m
        alertname: MRNotReadyCritical
        exp_alerts: []
      - eval_time: 70m
        alertname: MRNotReadyCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              gvk: "example.org/v1, Kind=Thing"
              rulesgroup: crossplane
            exp_annotations:
              summary: "Managed resources critically degraded for example.org/v1, Kind=Thing"
              description: "Only 50% of example.org/v1, Kind=Thing managed resources are Ready (below 0.995) for over 1h — a sustained, customer-visible failure."

  # --- Story 1.1 (negative): all resources ready (ratio 1.0) must NOT alert ---
  - name: fully ready GVK does not alert
    interval: 1m
    input_series:
      - series: 'crossplane_managed_resource_exists{job="crossplane-providers", gvk="example.org/v1, Kind=Healthy"}'
        values: '3x180'
      - series: 'crossplane_managed_resource_ready{job="crossplane-providers", gvk="example.org/v1, Kind=Healthy"}'
        values: '3x180'
    alert_rule_test:
      - eval_time: 90m
        alertname: MRNotReady
        exp_alerts: []

  # --- Story 4.1: Composite (XR) readiness from the inventory exporter's one-hot metric ---
  # alpha is fully healthy; e2e is Ready=True but Synced=False (reconcile error) — the real
  # case from the captured fixture. So CompositeNotSynced fires for e2e only; CompositeNotReady
  # fires for neither; the ready-ratio recording rule is still 1.0 (both Ready).
  - name: composite readiness and sync
    interval: 1m
    # Series carry a tenant-workspace `namespace` (as the real exporter emits) — proving the
    # rule expr matches tenant-namespaced series. NOTE: on OpenShift UWM, namespace ENFORCEMENT
    # (injected = the rule's own namespace) is what breaks this in production (finding N1);
    # promtool can't reproduce that injection, so this test asserts expr correctness only.
    input_series:
      - series: 'kube_customresource_crossplane_xr_xproject_condition{crossplane_kind="XProject", name="alpha", namespace="ws-alpha", type="Ready", status="True"}'
        values: '1x180'
      - series: 'kube_customresource_crossplane_xr_xproject_condition{crossplane_kind="XProject", name="alpha", namespace="ws-alpha", type="Synced", status="True"}'
        values: '1x180'
      - series: 'kube_customresource_crossplane_xr_xproject_condition{crossplane_kind="XProject", name="e2e", namespace="ws-e2e", type="Ready", status="True"}'
        values: '1x180'
      - series: 'kube_customresource_crossplane_xr_xproject_condition{crossplane_kind="XProject", name="e2e", namespace="ws-e2e", type="Synced", status="True"}'
        values: '0x180'
    promql_expr_test:
      - expr: crossplane:composite_ready:ratio
        eval_time: 30m
        exp_samples:
          - labels: 'crossplane:composite_ready:ratio{crossplane_kind="XProject"}'
            value: 1
    alert_rule_test:
      - eval_time: 20m
        alertname: CompositeNotReady
        exp_alerts: []
      - eval_time: 20m
        alertname: CompositeNotSynced
        exp_alerts:
          - exp_labels:
              severity: warning
              rulesgroup: crossplane
              crossplane_kind: XProject
              name: e2e
              namespace: ws-e2e
              type: Synced
              status: "True"
            exp_annotations:
              summary: "Composite XProject/e2e not synced"
              description: "Composite XProject/e2e has Synced != True for more than 15m — Crossplane cannot reconcile its desired state (often a reconcile error)."

  # --- Story 1.2 (upjet branch): TTRDegraded groups by (group, kind) ---
  # Regression for the label bug: upjet_resource_ttr_bucket has group/kind/version and NO
  # `gvk`; the rendered rule (upjet.enabled=true in validate.sh) must group by (group, kind)
  # so per-type series survive and the annotation is populated. p95 lands in (300s,600s] -> 585s.
  - name: TTR degraded on upjet providers (group/kind labels)
    interval: 1m
    input_series:
      - series: 'upjet_resource_ttr_bucket{job="crossplane-providers", group="s3.aws.m.upbound.io", kind="Bucket", version="v1beta1", le="300"}'
        values: '0+0x60'
      - series: 'upjet_resource_ttr_bucket{job="crossplane-providers", group="s3.aws.m.upbound.io", kind="Bucket", version="v1beta1", le="600"}'
        values: '0+10x60'
      - series: 'upjet_resource_ttr_bucket{job="crossplane-providers", group="s3.aws.m.upbound.io", kind="Bucket", version="v1beta1", le="+Inf"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: TTRDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              rulesgroup: crossplane
              group: s3.aws.m.upbound.io
              kind: Bucket
            exp_annotations:
              summary: "Slow provisioning for Bucket (s3.aws.m.upbound.io) (p95 TTR over SLO)"
              description: "p95 time-to-readiness for Bucket (s3.aws.m.upbound.io) is 9m 45s, above the 300s SLO, for more than 30m."

  # --- Story 6.1: CloudAPIThrottling groups by (group, kind) on the upjet delay histogram ---
  # p95 reconcile delay lands in (60s,120s] -> 117s, above the 60s threshold.
  - name: cloud API throttling on upjet delay histogram
    interval: 1m
    input_series:
      - series: 'upjet_resource_reconcile_delay_seconds_bucket{job="crossplane-providers", group="route53.aws.m.upbound.io", kind="Record", version="v1beta1", le="60"}'
        values: '0+0x30'
      - series: 'upjet_resource_reconcile_delay_seconds_bucket{job="crossplane-providers", group="route53.aws.m.upbound.io", kind="Record", version="v1beta1", le="120"}'
        values: '0+10x30'
      - series: 'upjet_resource_reconcile_delay_seconds_bucket{job="crossplane-providers", group="route53.aws.m.upbound.io", kind="Record", version="v1beta1", le="+Inf"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: CloudAPIThrottling
        exp_alerts:
          - exp_labels:
              severity: warning
              rulesgroup: crossplane
              group: route53.aws.m.upbound.io
              kind: Record
            exp_annotations:
              summary: "Cloud-API throttling suspected for Record (route53.aws.m.upbound.io)"
              description: "p95 reconcile delay for Record (route53.aws.m.upbound.io) is 1m 57s, above the 60s threshold, for more than 15m — the provider is falling behind, typically due to cloud-provider rate limiting (upstream of Crossplane)."

  # --- Story 5.1: FunctionErrorRate splits on result_severity="Fatal" ---
  # The response-total metric is labelled result_severity (Normal/Fatal), NOT result="error".
  # 1 Fatal/min against 101 total/min -> ratio ~0.99% > the 0.5% SLO.
  - name: function error rate uses result_severity=Fatal
    interval: 1m
    input_series:
      - series: 'function_run_function_response_total{job="crossplane", function_name="function-kcl", result_severity="Normal"}'
        values: '0+100x60'
      - series: 'function_run_function_response_total{job="crossplane", function_name="function-kcl", result_severity="Fatal"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: FunctionErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
              rulesgroup: crossplane
              function_name: function-kcl
            exp_annotations:
              summary: "Composition function function-kcl error rate high"
              description: "Function function-kcl error ratio is 0.9901% (SLO < 0.005) for more than 15m."

  # --- Story 4.2: CircuitBreakerDropRatioHigh splits on result="Dropped" ---
  # events_total is labelled controller + result (Allowed/Dropped/HalfOpenAllowed).
  # 30 Dropped/min against 100 total/min -> 30% > the 20% threshold.
  - name: circuit breaker drop ratio uses result=Dropped
    interval: 1m
    input_series:
      - series: 'circuit_breaker_events_total{job="crossplane", controller="composite/databases.data.cloud.stakater.com", result="Allowed"}'
        values: '0+70x60'
      - series: 'circuit_breaker_events_total{job="crossplane", controller="composite/databases.data.cloud.stakater.com", result="Dropped"}'
        values: '0+30x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: CircuitBreakerDropRatioHigh
        exp_alerts:
          - exp_labels:
              severity: critical
              rulesgroup: crossplane
              controller: composite/databases.data.cloud.stakater.com
            exp_annotations:
              summary: "Circuit breaker dropping events for composite/databases.data.cloud.stakater.com"
              description: "Controller composite/databases.data.cloud.stakater.com is dropping 30% of watch events (> 0.2) for more than 5m — a thrashing XR may be starving other tenants."

  # --- Story 3.1: DriftDetected reads the histogram's MEAN, not the bare metric name ---
  # crossplane_managed_resource_drift_seconds is a histogram (_bucket/_sum/_count); the bare
  # name does not exist, so the original gauge-form expr could never fire. Quantiles are
  # unusable (upstream buckets stop at le=10.0), hence rate(_sum)/rate(_count).
  # 1200s of drift per minute over 1 observation per minute -> 1200s mean > the 900s threshold.
  - name: drift detected uses histogram mean (sum/count)
    interval: 1m
    input_series:
      - series: 'crossplane_managed_resource_drift_seconds_sum{job="crossplane-providers", gvk="kv.vault.upbound.io/v1alpha1, Kind=SecretV2"}'
        values: '0+1200x180'
      - series: 'crossplane_managed_resource_drift_seconds_count{job="crossplane-providers", gvk="kv.vault.upbound.io/v1alpha1, Kind=SecretV2"}'
        values: '0+1x180'
      # A kind well under the threshold must stay quiet: 60s mean.
      - series: 'crossplane_managed_resource_drift_seconds_sum{job="crossplane-providers", gvk="route53.aws.upbound.io/v1beta1, Kind=Record"}'
        values: '0+60x180'
      - series: 'crossplane_managed_resource_drift_seconds_count{job="crossplane-providers", gvk="route53.aws.upbound.io/v1beta1, Kind=Record"}'
        values: '0+1x180'
    alert_rule_test:
      - eval_time: 120m
        alertname: DriftDetected
        exp_alerts:
          - exp_labels:
              severity: warning
              rulesgroup: crossplane
              gvk: "kv.vault.upbound.io/v1alpha1, Kind=SecretV2"
            exp_annotations:
              summary: "Drift detected for kv.vault.upbound.io/v1alpha1, Kind=SecretV2"
              description: "Managed resources of kv.vault.upbound.io/v1alpha1, Kind=SecretV2 are spending 20m 0s out of sync with desired state on average, above the 900s threshold, for more than 15m."
