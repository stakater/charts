{{- $r := .Values.prometheus.rules.metallb.addressPoolNearExhaustion }}
{{- if and ($r) ($r.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: metallb-address-pool-near-exhaustion
  namespace: {{ include "metallb-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "metallb-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: metallb.allocation
      rules:
        - alert: MetalLBAddressPoolNearExhaustion
          expr: |
            100 * metallb_allocator_addresses_in_use_total / metallb_allocator_addresses_total > {{ $r.thresholdPercent }}
            and metallb_allocator_addresses_total > 0
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: metallb
          annotations:
            summary: "MetalLB address pool {{`{{ $labels.pool }}`}} is {{`{{ $value | printf \"%.0f\" }}`}}% used"
            description: "Pool {{`{{ $labels.pool }}`}} is above {{ $r.thresholdPercent }}% utilization. Extend its address range before it exhausts — once full, new LoadBalancer Services hang <pending> silently."
{{- end }}
