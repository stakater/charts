{{- $r := .Values.prometheus.rules.etcd.diskSlow }}
{{- if and ($r) ($r.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-etcd-disk-slow
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.etcd
      rules:
        - alert: KcpEtcdDiskSlow
          expr: |
            (kcp:etcd_fsync_seconds:p99 > {{ $r.fsyncP99Seconds }}) or (kcp:etcd_commit_seconds:p99 > {{ $r.commitP99Seconds }})
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "kcp etcd disk p99 latency on {{`{{ $labels.pod }}`}} is {{`{{ $value | humanizeDuration }}`}}"
            description: "Rising fsync/backend-commit latency is the canonical precursor to control-plane-wide slowness."
{{- end }}
