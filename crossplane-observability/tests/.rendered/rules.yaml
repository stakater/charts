groups:
- name: crossplane.slo.resource-health
  rules:
  - record: crossplane:managed_resource_ready:ratio
    expr: 'sum by (gvk) (crossplane_managed_resource_ready{job="crossplane-providers"})

      /

      sum by (gvk) (crossplane_managed_resource_exists{job="crossplane-providers"}
      > 0)

      '
  - record: crossplane:managed_resource_ready:ratio:fleet
    expr: 'sum (crossplane_managed_resource_ready{job="crossplane-providers"})

      /

      clamp_min(sum (crossplane_managed_resource_exists{job="crossplane-providers"}),
      1)

      '
  - record: crossplane:managed_resource_ttr_seconds:p95
    expr: "histogram_quantile(0.95, sum by (le, gvk) (\n  rate(crossplane_managed_resource_first_time_to_readiness_seconds_bucket{job=\"\
      crossplane-providers\"}[30m])\n))\n"
  - record: crossplane:claim_tree_ttr_seconds:p95
    expr: "histogram_quantile(0.95, sum by (le) (\n  rate(crossplane_managed_resource_first_time_to_readiness_seconds_bucket{job=\"\
      crossplane-providers\"}[30m])\n))\n"
- name: crossplane.slo.control-plane
  rules:
  - record: crossplane:reconcile_errors:ratio
    expr: 'sum by (controller) (rate(controller_runtime_reconcile_errors_total{job="crossplane"}[1h]))

      /

      clamp_min(sum by (controller) (rate(controller_runtime_reconcile_total{job="crossplane"}[1h])),
      1)

      '
  - record: crossplane:reconcile_time_seconds:p99
    expr: "histogram_quantile(0.99, sum by (le, controller) (\n  rate(controller_runtime_reconcile_time_seconds_bucket{job=\"\
      crossplane\"}[5m])\n))\n"
- name: crossplane.inventory.counts
  rules:
  - record: crossplane:managed_resource:total
    expr: sum(crossplane_managed_resource_exists{job="crossplane-providers"})
- name: crossplane.slo.inventory
  rules:
  - record: crossplane:composite_ready:ratio
    expr: 'sum by (crossplane_kind) ({__name__=~"kube_customresource_crossplane_xr_.+_condition",
      type="Ready", status="True"})

      /

      clamp_min(count by (crossplane_kind) ({__name__=~"kube_customresource_crossplane_xr_.+_condition",
      type="Ready", status="True"}), 1)

      '
- name: crossplane.cloud
  rules:
  - alert: CloudAPIThrottling
    expr: "histogram_quantile(0.95, sum by (le, kind) (\n  rate(upjet_resource_reconcile_delay_seconds_bucket{job=\"\
      crossplane-providers\"}[15m])\n)) > 60\n"
    for: 15m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: Cloud-API throttling suspected for {{ $labels.kind }}
      description: "p95 reconcile delay for {{ $labels.kind }} is {{ $value | humanizeDuration\
        \ }}, above the 60s threshold, for more than 15m \u2014 the provider is falling\
        \ behind, typically due to cloud-provider rate limiting (upstream of Crossplane)."
- name: crossplane.control-plane
  rules:
  - alert: APIServiceUnavailable
    expr: aggregator_unavailable_apiservice{name=~".*crossplane.*"} == 1
    for: 5m
    labels:
      severity: critical
      rulesgroup: crossplane
    annotations:
      summary: Crossplane aggregated APIService {{ $labels.name }} unavailable
      description: "Aggregated APIService {{ $labels.name }} has been unavailable\
        \ for more than 5m. The Crossplane control plane is down \u2014 provisioning\
        \ and reconciliation are halted."
  - alert: DetectionLagHigh
    expr: "histogram_quantile(0.95, sum by (le, gvk) (\n  rate(crossplane_managed_resource_first_time_to_reconcile_seconds_bucket{job=\"\
      crossplane-providers\"}[15m])\n)) > 30\n"
    for: 15m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: "High create\u2192detect lag for {{ $labels.gvk }}"
      description: "p95 time from resource creation to first reconcile for {{ $labels.gvk\
        \ }} is {{ $value | humanizeDuration }}, above the 30s SLO, for more than\
        \ 15m \u2014 likely a watch/informer problem."
  - alert: ReconcileErrorRateHigh
    expr: crossplane:reconcile_errors:ratio{controller!~".*usage.*|.*compositeresourcedefinition.*|.*configurationrevision.*"}
      > 0.01
    for: 10m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: High reconcile error ratio for controller {{ $labels.controller }}
      description: Controller {{ $labels.controller }} reconcile error ratio is {{
        $value | humanizePercentage }} (SLO < 0.01) for more than 10m.
  - alert: ReconcileLatencyHigh
    expr: crossplane:reconcile_time_seconds:p99 > 30
    for: 15m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: High reconcile latency for controller {{ $labels.controller }}
      description: "Controller {{ $labels.controller }} p99 reconcile duration is\
        \ {{ $value | humanizeDuration }} (SLO \u2264 30s) for more than 15m."
  - alert: WorkqueueDepthGrowing
    expr: workqueue_depth{job="crossplane"} > 50
    for: 15m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: Crossplane workqueue {{ $labels.name }} backlog growing
      description: "Workqueue {{ $labels.name }} depth has stayed above 50 (currently\
        \ {{ $value }}) for more than 15m \u2014 reconciles are not keeping up with\
        \ demand."
- name: crossplane.drift
  rules:
  - alert: DriftDetected
    expr: crossplane_managed_resource_drift_seconds{job="crossplane-providers"} >
      600
    for: 15m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: Drift detected for {{ $labels.gvk }}
      description: Managed resources of {{ $labels.gvk }} have been out of sync with
        desired state for {{ $value | humanizeDuration }} (threshold 600s).
- name: crossplane.fleet
  rules:
  - alert: CircuitBreakerDropRatioHigh
    expr: 'sum by (controller) (rate(circuit_breaker_events_total{job="crossplane",
      result="Dropped"}[5m]))

      /

      clamp_min(sum by (controller) (rate(circuit_breaker_events_total{job="crossplane"}[5m])),
      1)

      > 0.2

      '
    for: 5m
    labels:
      severity: critical
      rulesgroup: crossplane
    annotations:
      summary: Circuit breaker dropping events for {{ $labels.controller }}
      description: "Controller {{ $labels.controller }} is dropping {{ $value | humanizePercentage\
        \ }} of watch events (> 0.2) for more than 5m \u2014 a thrashing XR may be\
        \ starving other tenants."
  - alert: CircuitBreakerFrequentOpens
    expr: 'sum by (controller) (increase(circuit_breaker_opens_total{job="crossplane"}[1h]))
      > 6

      '
    for: 15m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: Circuit breaker opening frequently for {{ $labels.controller }}
      description: "Controller {{ $labels.controller }} circuit breaker opened more\
        \ than 6 times in the last hour (sustained 15m) \u2014 repeated reconcile\
        \ storms."
  - alert: CompositeNotReady
    expr: '{__name__=~"kube_customresource_crossplane_xr_.+_condition", type="Ready",
      status="True"} == 0'
    for: 15m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: Composite {{ $labels.crossplane_kind }}/{{ $labels.name }} not ready
      description: "Composite {{ $labels.crossplane_kind }}/{{ $labels.name }} has\
        \ Ready != True for more than 15m \u2014 the customer's end-to-end request\
        \ is not satisfied."
  - alert: CompositeNotSynced
    expr: '{__name__=~"kube_customresource_crossplane_xr_.+_condition", type="Synced",
      status="True"} == 0'
    for: 15m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: Composite {{ $labels.crossplane_kind }}/{{ $labels.name }} not synced
      description: "Composite {{ $labels.crossplane_kind }}/{{ $labels.name }} has\
        \ Synced != True for more than 15m \u2014 Crossplane cannot reconcile its\
        \ desired state (often a reconcile error)."
- name: crossplane.footprint
  rules:
  - alert: ProviderPodCPUThrottled
    expr: 'rate(container_cpu_cfs_throttled_periods_total{namespace="default", pod=~"provider.*",
      container!=""}[5m])

      /

      clamp_min(rate(container_cpu_cfs_periods_total{namespace="default", pod=~"provider.*",
      container!=""}[5m]), 1)

      > 0.01

      '
    for: 15m
    labels:
      severity: info
      rulesgroup: crossplane
    annotations:
      summary: Crossplane provider pod {{ $labels.pod }} CPU-throttled
      description: "Provider pod {{ $labels.pod }} is CPU-throttled {{ $value | humanizePercentage\
        \ }} of the time (SLO < 0.01) for more than 15m \u2014 consider raising its\
        \ CPU limit."
  - alert: ProviderPodOOM
    expr: 'kube_pod_container_status_last_terminated_reason{namespace="default", pod=~"provider.*",
      reason="OOMKilled"} == 1

      '
    for: 5m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: Crossplane provider pod {{ $labels.pod }} OOMKilled
      description: "Container {{ $labels.container }} in provider pod {{ $labels.pod\
        \ }} was OOMKilled. Raise its memory limit or investigate the leak \u2014\
        \ reconciles stop while it is down."
  - alert: ProviderPodRestarting
    expr: 'increase(kube_pod_container_status_restarts_total{namespace="default",
      pod=~"provider.*"}[1h]) > 2

      '
    for: 10m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: Crossplane provider pod {{ $labels.pod }} restarting
      description: Provider pod {{ $labels.pod }} has restarted more than 2 times
        in 1h. While it is down its reconciles do not run.
- name: crossplane.functions
  rules:
  - alert: FunctionCacheErrorRate
    expr: "sum (rate(function_run_function_response_cache_hits_total{job=\"crossplane\"\
      }[10m]))\n/\nclamp_min(sum (\n  rate(function_run_function_response_cache_hits_total{job=\"\
      crossplane\"}[10m])\n  + rate(function_run_function_response_cache_misses_total{job=\"\
      crossplane\"}[10m])\n  + rate(function_run_function_response_cache_errors_total{job=\"\
      crossplane\"}[10m])\n), 1)\n< 0.9\n"
    for: 15m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: Composition function cache hit ratio low
      description: "Function response cache hit ratio is {{ $value | humanizePercentage\
        \ }}, below the 0.9 SLO, for more than 15m \u2014 reconcile latency is being\
        \ inflated by cache misses/errors."
  - alert: FunctionErrorRate
    expr: 'sum by (function_name) (rate(function_run_function_response_total{job="crossplane",
      result_severity="Fatal"}[5m]))

      /

      clamp_min(sum by (function_name) (rate(function_run_function_response_total{job="crossplane"}[5m])),
      1)

      > 0.005

      '
    for: 15m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: Composition function {{ $labels.function_name }} error rate high
      description: Function {{ $labels.function_name }} error ratio is {{ $value |
        humanizePercentage }} (SLO < 0.005) for more than 15m.
  - alert: FunctionLatencyHigh
    expr: "histogram_quantile(0.95, sum by (le, function_name) (\n  rate(function_run_function_seconds_bucket{job=\"\
      crossplane\"}[5m])\n)) > 5\n"
    for: 15m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: Composition function {{ $labels.function_name }} slow
      description: "p95 execution time for function {{ $labels.function_name }} is\
        \ {{ $value | humanizeDuration }} (SLO \u2264 5s) for more than 15m."
- name: crossplane.resource-health
  rules:
  - alert: ClaimTreeNotReady
    expr: crossplane:claim_tree_ttr_seconds:p95 > 360
    for: 15m
    labels:
      severity: critical
      rulesgroup: crossplane
    annotations:
      summary: "End-to-end Claim\u2192XR\u2192MR provisioning over SLO"
      description: "p95 time for the full Claim\u2192XR\u2192MR tree to become ready\
        \ is {{ $value | humanizeDuration }}, above the internal 360s SLO, for more\
        \ than 15m. This is the headline customer-experience signal."
  - alert: MRNotReady
    expr: crossplane:managed_resource_ready:ratio < 1
    for: 15m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: Managed resources not all ready for {{ $labels.gvk }}
      description: Only {{ $value | humanizePercentage }} of {{ $labels.gvk }} managed
        resources are Ready (SLO 1) for more than 15m. Some infrastructure may exist
        but be unusable.
  - alert: MRNotReadyCritical
    expr: crossplane:managed_resource_ready:ratio < 0.995
    for: 1h
    labels:
      severity: critical
      rulesgroup: crossplane
    annotations:
      summary: Managed resources critically degraded for {{ $labels.gvk }}
      description: "Only {{ $value | humanizePercentage }} of {{ $labels.gvk }} managed\
        \ resources are Ready (below 0.995) for over 1h \u2014 a sustained, customer-visible\
        \ failure."
  - alert: TTRDegraded
    expr: "histogram_quantile(0.95, sum by (le, gvk) (\n  rate(\n    upjet_resource_ttr_bucket{job=\"\
      crossplane-providers\"}[30m]\n  )\n)) > 300\n"
    for: 30m
    labels:
      severity: warning
      rulesgroup: crossplane
    annotations:
      summary: Slow provisioning for {{ $labels.gvk }} (p95 TTR over SLO)
      description: p95 time-to-readiness for {{ $labels.gvk }} is {{ $value | humanizeDuration
        }}, above the 300s SLO, for more than 30m.
