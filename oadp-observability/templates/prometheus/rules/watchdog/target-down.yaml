{{- $r := .Values.prometheus.rules.watchdog.targetDown }}
{{- if and ($r) ($r.enabled) }}
{{- $targets := list }}
{{- if and .Values.prometheus.monitors.veleroServiceMonitor .Values.prometheus.monitors.veleroServiceMonitor.enabled }}
{{- $targets = append $targets (dict "target" "velero" "job" .Values.oadp.velero.job) }}
{{- end }}
{{- if and .Values.prometheus.monitors.nodeAgentPodMonitor .Values.prometheus.monitors.nodeAgentPodMonitor.enabled }}
{{- $targets = append $targets (dict "target" "node-agent" "job" (printf "%s/%s-node-agent" (include "oadp-observability.namespace" .) (include "oadp-observability.fullname" .))) }}
{{- end }}
{{- if .Values.stateExporter.enabled }}
{{- $targets = append $targets (dict "target" "state-exporter" "job" (printf "%s-state-exporter" (include "oadp-observability.fullname" .))) }}
{{- end }}
{{- if $targets }}
# A scrape target exists but fails. While it does, every alert that depends on its
# metrics is disarmed (absent() cannot see this: the up series exists, at 0).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "oadp-observability.fullname" . }}-target-down
  namespace: {{ include "oadp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "oadp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: oadp.watchdog
      rules:
        {{- range $t := $targets }}
        - alert: OadpTargetDown
          expr: |
            up{job="{{ $t.job }}"} == 0
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: oadp
            target: {{ $t.target }}
          annotations:
            summary: "{{ $t.target }} metrics target {{`{{ $labels.pod }}`}} is down"
            description: "Prometheus cannot scrape {{`{{ $labels.pod }}`}}. While it is down, backup alerts that depend on its metrics cannot fire. If it is the Velero server, scheduled backups are also not running."
            runbook_url: "{{ $.Values.prometheus.rules.runbookBaseURL }}#oadptargetdown"
        {{- end }}
{{- end }}
{{- end }}
