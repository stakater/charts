# Default values for crossplane-observability.
# This is a YAML-formatted file.
#
# The chart implements the Crossplane Observability Roadmap (see docs/roadmap.md).
# Everything is organised by the roadmap's capability areas and user stories. Each
# alert/recording rule is one file under templates/, gated by its own `enabled` flag,
# and reads its thresholds/durations from the matching block here.
#
# ⚠️ Every numeric threshold below is a PLACEHOLDER. The roadmap requires 2–4 weeks of
# real baseline before committing SLA numbers, segmented per tier and per resource class.

global:
  # Namespace the monitoring objects are created in. Defaults to the release
  # namespace, which must be the namespace Crossplane runs in.
  namespace:

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Identity of the Crossplane installation being monitored.
# ---------------------------------------------------------------------------
crossplane:
  # Crossplane core (the aggregated-API / controller pods).
  core:
    # Release/fullname of the Crossplane core install.
    name: crossplane
    # The `job` label the core metrics land under once scraped, used in alert/recording
    # expressions. Prometheus-operator defaults this to the (Pod|Service)Monitor name, but
    # many installs already scrape core under a different job — set it to match. On Stakater Cloud
    # this is `crossplane-metrics`.
    job: crossplane
    # Label selector for the core metrics Service (used only when coreServiceMonitor is
    # enabled). Default targets the metrics Service by component; the upstream metrics
    # Service has no per-instance label, so don't require one.
    serviceMonitorSelector:
      matchLabels:
        app.kubernetes.io/name: crossplane
        app.kubernetes.io/component: metrics
  # Crossplane providers. As of crossplane-runtime PR #683 / upjet v1.3.0 every
  # provider emits the crossplane_managed_resource_* family natively on /metrics,
  # so leaf-MR readiness/TTR/drift come from the provider pods (PodMonitor below).
  providers:
    # Label selector that matches the provider pods (used only when providerPodMonitor is
    # enabled). Default matches any provider revision pod; override for your install.
    selector:
      matchExpressions:
        - { key: pkg.crossplane.io/revision, operator: Exists }
    # The `job` label provider metrics land under once scraped. On Stakater Cloud this is
    # `crossplane-system/crossplane-providers-and-functions`.
    job: crossplane-providers
  # Story 4.1 — Composite (XR) inventory & readiness. The leaf-MR metrics above are per-GVK
  # counts that do NOT cover the Composite/Claim layer the customer experiences. That comes
  # from an inventory exporter (resource-state-metrics / ksm-crossplane), which emits a
  # ONE-HOT condition metric: one series per (resource, condition type, status), valued 1/0.
  # Confirmed shape on Stakater Cloud (ksm-crossplane):
  #   kube_customresource_crossplane_xr_xproject_condition{
  #     crossplane_kind="XProject", name="<xr>", type="Ready", status="True"} 1|0
  # Deploy one (see docs/resource-state-metrics-example.yaml), point conditionMetricPattern
  # at your exporter's family names, and enable inventory + the composite rules below.
  inventory:
    # ⚠️ OpenShift UWM caveat: user-workload PrometheusRules are namespace-ENFORCED — UWM
    # injects namespace="<this chart's namespace>" into every rule expr. The inventory series
    # are emitted per-XR and carry the TENANT namespace, so the composite recording rule/alerts
    # (deployed in the Crossplane namespace) match NOTHING and fire 0 — silently. 0 firing is
    # NOT "all healthy". The dashboard panels are unaffected (Grafana queries thanos-querier
    # directly, which is not namespace-enforced). See README "Inventory rules on OpenShift UWM".
    enabled: false
    # Regex (PromQL __name__=~, anchored) matching the exporter's per-kind one-hot condition
    # metrics. The family name embeds the XR kind, so this covers ALL XR kinds at once; the
    # crossplane_kind label keeps them distinct in alerts/recording rules.
    conditionMetricPattern: "kube_customresource_crossplane_xr_.+_condition"
    # Condition `type` label values to watch.
    readyType: "Ready"
    syncedType: "Synced"
    # The `job` label the exporter's metrics land under once scraped.
    job: ksm-crossplane

# Upjet providers (provider-upjet-aws, -gcp, -azure, …). Gates the Upjet-only
# diagnostics (Story 6.1) and the more-accurate Upjet TTR signal (Story 1.2).
upjet:
  enabled: false

# ---------------------------------------------------------------------------
# Inventory & billing (Managed Resource Units).
#   Capacity (leaf cloud resources): crossplane_managed_resource_exists (per gvk).
#   Billing (customer-facing units):  count the inventory exporter's per-object _info metric
#     for XRs/Claims — these carry `crossplane_kind` and (claims + namespaced XRs) a
#     `namespace` = the tenant workspace. See docs/billing.md.
# Billing numbers are DASHBOARD panels (raw cross-namespace queries via thanos-querier), not
# UWM recording rules: the inventory series carry tenant namespaces and a UWM rule would be
# namespace-enforced to empty (same as the composite alerts, README "Inventory rules on UWM").
# ---------------------------------------------------------------------------
billing:
  # Regex (__name__=~) matching the exporter's per-object condition metrics. We count the
  # `{type="Ready",status="True"}` series — exactly one per object — to get the unit count.
  # Default counts both XRs and Claims — pick ONE layer per kind to avoid double-counting (a
  # Claim and the XR it creates are the same unit). The dashboard $billable variable narrows by
  # `crossplane_kind`; $tenant narrows by `namespace` (claims + namespaced XRs carry it).
  unitMetricPattern: "kube_customresource_crossplane_(xr|claim)_.+_condition"
  # The label identifying the tenant / service-provider customer (workspace namespace).
  tenantLabel: "namespace"

# ---------------------------------------------------------------------------
# Grafana dashboard (managed via grafana-operator GrafanaDashboard CR).
# ---------------------------------------------------------------------------
grafana:
  # Namespace to create the Grafana CRs (GrafanaDashboard and, for compositeAlerts,
  # GrafanaFolder + GrafanaAlertRuleGroup) in. Defaults to the release namespace.
  # Set this to the Grafana instance's namespace: a namespace-scoped grafana-operator
  # (OperatorGroup targetNamespaces) only reconciles CRs in the namespace(s) it watches,
  # regardless of allowCrossNamespaceImport (which only governs which instance imports them).
  namespace: ""
  folder: "Crossplane Observability"
  # Let a Grafana instance in another namespace import this dashboard.
  allowCrossNamespaceImport: true
  # Selects the target Grafana instance. Default matches the Stakater Cloud convention
  # (app: grafana); override per-cluster if the live instance is labelled differently.
  instanceSelector:
    matchLabels:
      app: "grafana"
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "Prometheus"
  dashboard:
    enabled: true

  # Grafana-managed alerts for the cross-tenant composite/inventory signals (Story 4.1) that
  # a UWM PrometheusRule cannot evaluate (namespace-enforced — see docs/alerting-architecture.md).
  # Grafana queries thanos-querier (not namespace-enforced) and forwards firing alerts to your
  # existing Alertmanager via a Grafana contact point — same routing/receivers as everything else.
  # Use these on UWM INSTEAD of the prometheus.rules.fleet.composite* PrometheusRule alerts.
  compositeAlerts:
    enabled: false
    # UID of the Prometheus/Thanos datasource in your Grafana that can read across namespaces
    # (e.g. the thanos-querier / cluster-monitoring datasource). REQUIRED when enabled.
    datasourceUid: ""
    # Title of the Grafana folder the alert group lands in. Defaults to "<grafana.folder> Alerts".
    # MUST be distinct from grafana.folder (the dashboard folder): grafana-operator keys folders by
    # title, so a shared title makes the GrafanaAlertRuleGroup's folderRef fail to resolve.
    folder: ""
    # Evaluation interval and pending duration.
    interval: 1m
    for: 15m
    severity: warning

# ---------------------------------------------------------------------------
# Prometheus configuration
# ---------------------------------------------------------------------------
prometheus:
  # Scrape configuration. Both default to disabled — turn them on once the matching
  # metrics ports are confirmed exposed (see docs/roadmap.md, Decision 2).
  monitors:
    # Scrapes Crossplane core /metrics (controller-runtime, workqueue, circuit
    # breaker, function-pipeline metrics).
    coreServiceMonitor:
      enabled: false
      port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
    # Scrapes the provider pods (crossplane_managed_resource_* + upjet_* metrics).
    providerPodMonitor:
      enabled: false
      port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

  # SLO recording rules — pre-compute the SLIs so error-budget burn is directly
  # queryable and the headline composite SLO (Story 1.3) has a single series.
  recordingRules:
    enabled: true

  rules:
    # Extra labels added to every PrometheusRule (e.g. for Alertmanager routing, or
    # to match your Prometheus ruleSelector).
    labels: {}

    # ===== Capability Area 1 — Customer-Facing Resource Health =====
    resourceHealth:
      # Story 1.1 — managed resources of a GVK not all healthy. The state metrics are
      # per-GVK counts, so this is ratio-based (ready/exists) via the recording rule, with
      # escalation by duration. ratioBelow 1.0 = any not-ready; lower = a worse fraction.
      mrNotReady:
        enabled: true
        ratioBelow: 1.0
        for: 15m
        severity: warning
      mrNotReadyCritical:
        enabled: true
        ratioBelow: 0.995
        for: 1h
        severity: critical
      # Story 1.2 — provisioning too slow (time-to-readiness).
      ttrDegraded:
        enabled: true
        # p95 create→Ready SLO, seconds (roadmap: 5m). Per-class calibration needed.
        thresholdSeconds: 300
        quantile: "0.95"
        for: 30m
        severity: warning
      # Story 1.3 — headline: full Claim→XR→MR tree not ready. Uses the recording
      # rule below; run the internal SLO tighter than the published SLA.
      claimTreeNotReady:
        enabled: true
        # p95 full-tree time-to-ready SLO, seconds (internal target, publish looser).
        thresholdSeconds: 360
        for: 15m
        severity: critical

    # ===== Capability Area 2 — Control-Plane Health (internal, leading indicators) =====
    controlPlane:
      # Story 2.1 — reconcile error ratio.
      reconcileErrorRateHigh:
        enabled: true
        # Error-reconcile ratio over 1h (roadmap SLO: < 1%).
        threshold: 0.01
        for: 10m
        severity: warning
        # Controllers excluded from this ALERT. PromQL !~ is FULLY ANCHORED (^…$) and the
        # real `controller` label values are path-prefixed FQDNs
        # (e.g. "usage/usage.apiextensions.crossplane.io",
        # "packages/configurationrevision.pkg.crossplane.io"), so every alternative must be
        # wildcarded (.*….*) or it never matches. These apiextensions/usage/package
        # reconcilers churn with retries in steady state and would page on internal noise,
        # not customer impact; they stay visible on the dashboard/recording rule — only the
        # page is suppressed. `.*usage.*` covers usage AND clusterusage. Set "" to alert on all.
        excludeControllers: ".*usage.*|.*compositeresourcedefinition.*|.*configurationrevision.*"
      # Story 2.2 — reconcile latency.
      reconcileLatencyHigh:
        enabled: true
        # p99 reconcile duration, seconds (baseline-calibrated placeholder).
        thresholdSeconds: 30
        quantile: "0.99"
        for: 15m
        severity: warning
      # Story 2.3 — workqueue backlog growing.
      workqueueDepthGrowing:
        enabled: true
        # Sustained queue depth above this is a backlog (baseline-calibrated).
        threshold: 50
        for: 15m
        severity: warning
      # Story 2.4 — Crossplane aggregated API unavailable (control-plane availability SLA).
      apiServiceUnavailable:
        enabled: true
        for: 5m
        severity: critical
      # Story 2.5 — detection lag (create → first reconcile).
      detectionLagHigh:
        enabled: true
        thresholdSeconds: 30
        quantile: "0.95"
        for: 15m
        severity: warning

    # ===== Capability Area 3 — Correctness & Drift =====
    drift:
      # Story 3.1 — managed resource drifted from desired state.
      driftDetected:
        enabled: true
        # Time-out-of-sync before detection, seconds, before alerting.
        thresholdSeconds: 600
        for: 15m
        severity: warning

    # ===== Capability Area 4 — Fleet Inventory & Multi-Tenancy =====
    fleet:
      # Story 4.1 — Composite (XR) readiness, per resource. Needs the inventory exporter
      # (crossplane.inventory.* above), so these only render when inventory.enabled.
      # Ready and Synced are separate: a composite can be Ready=True yet Synced=False
      # (reconcile error) — the e2e-hc-test case in the captured fixture.
      compositeNotReady:
        enabled: true
        for: 15m
        severity: warning
      compositeNotSynced:
        enabled: true
        for: 15m
        severity: warning
      # Story 4.2 — noisy-tenant / reconcile-thrashing protection. PHASE 2: the
      # circuit-breaker metrics are confirm-on-build, guaranteed after the 2.2/2.3
      # upgrade. Upstream-published thresholds, used verbatim.
      circuitBreakerDropRatioHigh:
        enabled: false
        # > 20% events dropped for 5m → critical (upstream value).
        threshold: 0.20
        for: 5m
        severity: critical
      circuitBreakerFrequentOpens:
        enabled: false
        # > 6 opens/hr for 15m → warning (upstream value).
        threshold: 6
        for: 15m
        severity: warning

    # ===== Capability Area 5 — Composition / Function Pipeline (PHASE 2) =====
    # Function-pipeline metrics arrive with the 2.2/2.3 upgrade — OFF by default.
    functions:
      functionLatencyHigh:
        enabled: false
        thresholdSeconds: 5
        quantile: "0.95"
        for: 15m
        severity: warning
      functionErrorRate:
        enabled: false
        # Function error ratio (roadmap SLO: < 0.5%).
        threshold: 0.005
        for: 15m
        severity: warning
      functionCacheErrorRate:
        enabled: false
        # Minimum acceptable cache hit ratio (roadmap SLO: ≥ 90%).
        minHitRatio: 0.90
        for: 15m
        severity: warning

    # ===== Capability Area 6 — Cloud Provider Interaction =====
    cloud:
      # Story 6.1 — cloud-API throttling. Upjet providers only; gated on upjet.enabled.
      # Never an SLA (failure is upstream at the cloud provider).
      cloudAPIThrottling:
        enabled: false
        # p95 reconcile-delay threshold, seconds. Calibrate against the providers'
        # configured poll interval (default upjet poll is 1m / 60s).
        thresholdSeconds: 60
        for: 15m
        severity: warning

    # ===== Capability Area 7 — Resource Footprint =====
    footprint:
      # Story 7.1 — provider pod crashing / OOM.
      providerPodRestarting:
        enabled: true
        # Restarts per provider over the lookback window before alerting.
        threshold: 2
        window: 1h
        for: 10m
        severity: warning
      providerPodOOM:
        enabled: true
        for: 5m
        severity: warning
      # Story 7.2 — provider pod CPU-throttled (under-provisioned).
      providerPodCPUThrottled:
        enabled: true
        # Fraction of CFS periods throttled (roadmap SLO: < 1%).
        threshold: 0.01
        for: 15m
        severity: info
