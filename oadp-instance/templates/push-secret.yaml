{{- if and (.Values.pushSecret).enabled (.Capabilities.APIVersions.Has "external-secrets.io/v1alpha1") }}
{{- $top := . }}
{{- range $backuplocation := .Values.backupLocations }}
{{- /*
Which Secret is the source of truth for this location's credentials.

When this chart also creates the bucket (clusterBackup, s3) and the location
points at that bucket, the AwsVeleroBackupBucket composition writes a
Velero-format Secret named after the bucket into this namespace, holding the
access key of the per-cluster IAM user the bucket policy allows. Push THAT,
with Replace, so OpenBao (and from it the ExternalSecret-owned credential
Secret) always carries the key that can actually reach the bucket.

Before this, the source was the credential Secret itself, seeded by
`ksp up --extra-secrets` and pushed IfNotExists. A seed cannot know the
per-cluster key (it only exists after the composition runs), so a fresh
cluster got whatever the seed held and kept it: on eu-4 a key for another
AWS account, and the BackupStorageLocation sat Unavailable with
AccessDenied on s3:ListBucket.

Any other location (BYO bucket) keeps the seed behaviour.
*/ -}}
{{- $generated := and $top.Values.clusterBackup.enabled (eq $top.Values.clusterBackup.bucketType "s3") (eq ((($backuplocation.velero).objectStorage).bucket) $top.Values.clusterBackup.awsBucketName) }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ $backuplocation.velero.credential.name }}
  namespace: {{ include "oadp-instance.namespace" $ }}
spec:
  refreshInterval: 10s
  updatePolicy: {{ ternary "Replace" "IfNotExists" $generated }}
  secretStoreRefs:
    - name: stakater-cluster-secret-store
      kind: ClusterSecretStore
  selector:
    secret:
      name: {{ ternary $top.Values.clusterBackup.awsBucketName $backuplocation.velero.credential.name $generated }}
  data:
    - match:
        remoteRef:
          remoteKey: stakater/oadp/{{ $backuplocation.velero.provider }}/cloud-credentials
{{- end }}
  {{- end }}
