# oadp-observability values.
#
# Metric names are pinned from the Velero 1.16 / OADP 1.5 source (cited in
# tests/metrics-allowlist.documented.txt) and must be confirmed by a live capture before
# release (tests/METRICS-CAPTURE.md). Do not add a rule that references a metric which is
# not in tests/fixtures/ (captured) or the documented allowlist. tests/validate.sh enforces this.

nameOverride: ""
fullnameOverride: ""
# Namespace the monitoring objects land in. Must be the namespace OADP runs in
# (openshift-adp by default) so UWM can resolve the scrape targets. Defaults to the
# release namespace.
namespaceOverride: ""

# --- What we are observing -------------------------------------------------------------
# The Velero server's metrics Service, created by the OADP operator for every DPA
# (oadp-operator@oadp-1.5 internal/controller/monitor.go): openshift-adp-velero-metrics-svc,
# port "monitoring" (8085, plain http). Confirm against the live capture before release.
oadp:
  velero:
    # UWM sets job=<Service name> for ServiceMonitor targets.
    job: "openshift-adp-velero-metrics-svc"
    # A Schedule declares its own RPO budget with this annotation, in HOURS as a plain
    # decimal ("2", "0.5"; no unit suffix). The state exporter reads it; OadpBackupStale and
    # OadpBackupNoSuccessfulBackup compare each schedule against its own budget. Schedules
    # without it use prometheus.rules.velero.backupStale.maxAgeHours.
    budgetAnnotation: "oadp-observability.stakater.com/max-age-hours"
  # The node-agent DaemonSet (the OADP operator creates it when the DPA enables nodeAgent). It
  # runs Kopia to move VOLUME data: file-system backups and the data mover. Its pods expose
  # podVolume_* on port "metrics" (8085); there is no Service, so the chart uses a PodMonitor.
  nodeAgent:
    daemonset: node-agent

# --- OADP state exporter (see docs/state-exporter.md) ------------------------------------
# A kube-state-metrics instance in custom-resource-state-only mode exporting what Velero's
# own metrics lack or get wrong:
#   kube_customresource_backupstoragelocation_status_phase{name, phase="Available|Unavailable"}
#     — Velero has no BSL metric (an Unavailable BSL fails every backup).
#   kube_customresource_schedule_created{schedule}
#     — the "never succeeded" anchor for OadpBackupNoSuccessfulBackup. Velero's own
#       velero_backup_last_status is reset to 1 every minute by its Schedule controller
#       (InitSchedule), so it cannot carry a failure.
# REQUIRED for OadpBackupNoSuccessfulBackup and OadpBackupStorageLocationUnavailable.
# Default OFF like the monitors (it is a new Deployment in openshift-adp); enable per cluster.
stateExporter:
  enabled: false
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.20.0
    pullPolicy: IfNotPresent
  interval: 30s
  # Leave unset on OpenShift: restricted-v2 assigns a UID from the namespace range (a fixed
  # one outside it is rejected). On vanilla Kubernetes set it (e.g. 65534): the KSM image's
  # user is the non-numeric "nobody", which runAsNonRoot cannot verify without it.
  runAsUser: null
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

grafana:
  namespace: ""                          # where the Grafana CR lives; defaults per-cluster
  folder: "OADP Observability"
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      app: "grafana"
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: Prometheus
  dashboard:
    enabled: true

prometheus:
  # ServiceMonitor/PodMonitor per component. Default OFF — the operator opts in per cluster.
  monitors:
    veleroServiceMonitor:
      enabled: false
      interval: 30s
    # Scrapes the node-agent pods (podVolume_*). Enables OadpDataMoverFailed and the node-agent
    # watchdog. Only useful where volume data is backed up (file-system backup / data mover).
    nodeAgentPodMonitor:
      enabled: false
      interval: 30s
  # One block per alert (one PrometheusRule file each). See docs/runbook.md.
  rules:
    # Alertmanager routing / ruleSelector labels merged into every PrometheusRule.
    labels: {}
    # Base URL of the runbook; each alert appends #<alertname-lowercased>.
    runbookBaseURL: "https://github.com/stakater/charts/blob/main/oadp-observability/docs/runbook.md"
    # The backup OUTCOME: is there a recent Completed backup per schedule?
    # The two alerts are mutually exclusive: Stale needs a success timestamp to exist,
    # NoSuccessfulBackup needs it to be absent. Ad-hoc backups (schedule="") are excluded.
    velero:
      backupStale:
        enabled: true
        for: 15m
        severity: critical
        # DEFAULT budget, for schedules without the budget annotation (oadp.velero.budgetAnnotation).
        # 25h fits a daily schedule: one interval + 1h grace.
        maxAgeHours: 25
      # Needs stateExporter.enabled (Schedule age). Fires when a Schedule is older than its
      # budget (annotation, else backupStale.maxAgeHours) and no Completed backup is visible.
      noSuccessfulBackup:
        enabled: true
        for: 15m
        severity: critical
      # Causes: the page must state WHAT is broken.
      # The BSL (bucket) failed validation, e.g. credentials rejected. Needs stateExporter.enabled.
      bslUnavailable:
        enabled: true
        for: 15m
        severity: critical
      # A backup ended Failed / FailedValidation / PartiallyFailed (label `phase`).
      # A cause NOTIFICATION: resolves once `window` passes without a new failure; the
      # outcome alerts above keep paging until a backup actually succeeds.
      backupFailed:
        enabled: true
        for: 0m
        severity: warning
        window: 12h
      # A RESTORE ended Failed / PartiallyFailed / FailedValidation (label `phase`; `schedule`
      # only for restores created --from-schedule). All restores are included: they are
      # deliberate, and most name a backup directly (schedule="").
      restoreFailed:
        enabled: true
        for: 0m
        severity: warning
        window: 12h
      # A data mover UPLOAD (backup) or DOWNLOAD (restore) of volume data failed on a node
      # (labels `node`, `direction`). Needs nodeAgentPodMonitor.
      dataMoverFailed:
        enabled: true
        for: 0m
        severity: warning
        window: 12h
      # node-agent pods not ready: volume data can't be backed up/restored on those nodes.
      # From kube-state-metrics (kube_daemonset_status_number_unavailable); no scrape needed,
      # and silent where the DPA doesn't enable the node-agent (no DaemonSet, no series).
      nodeAgentUnavailable:
        enabled: true
        for: 15m
        severity: warning
    # Blindness: if the metrics vanish, every alert above is silently disarmed.
    # Rendered only for ENABLED components, so a disabled one never fires them.
    watchdog:
      metricsAbsent:
        enabled: true
        for: 10m
        severity: warning
      targetDown:
        enabled: true
        for: 5m
        severity: critical
