# `true` to create (and clean up) manual InstallPlan approval resources as part of post-install,post-upgrade helm hook
# `false` to create  manual InstallPlan approval resources as part of normal install
#
# The hook method is nice to not have lingering resources needed for the manual InstallPlan approval but has the downside
# that no CustomResources using CustomResourceDefinitions installed by the operator can be used in the same chart because
# the operator InstallPlan wont be approved, and therefor the operator wont be installed, until the post-install,post-upgrade phase
# which means you will never get to that phase because your CustomResources wont be able to apply because the Operator isn't installed.
# This is is ultimately a trade off between cleaning up these resources or being able to install and configure the operator in the same
# helm chart that has a dependency on this helm chart.
approveManualInstallPlanViaHook: true

# Image to use for the InstallPlan Approver and Verify Jobs
installPlanApproverAndVerifyJobsImage: quay.io/openshift/origin-cli:4.22.0

annotations:
  # BeforeHookCreation is load-bearing, not tidiness. These Jobs are named after the
  # operator's `csv` value, so the name is stable across syncs — and a Job's
  # spec.template is immutable. A previously FAILED approver/verifier Job therefore
  # blocks its own replacement: ArgoCD tries to patch it and the sync dies with
  #   Job.batch "<csv>-approver" is invalid: spec.template: Invalid value: ...
  # so the InstallPlan is never approved and the operator never installs — even
  # after the values that caused the original failure have been corrected. Recovery
  # then needs the stale Jobs deleted by hand (hit twice on y0c8muex while fixing
  # the VPA pin, SA-8641). HookSucceeded alone does not help: it only removes Jobs
  # that succeeded, and it is exactly the failed ones that wedge the next sync.
  argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
  argocd.argoproj.io/hook: Sync

## Both Helm are argo hooks are defined . as per docs . If you define some Argo CD hooks in addition to the Helm ones, the Helm hooks will be ignored.
## https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#helm-hooks

# Per-operator manual-approval knobs (all optional):
#
#   pinPolicy: strict | track   (default: strict)
#     strict - only the pinned `csv` is approved/verified. If the catalog
#              channel head has moved past the pin and the pin is not
#              installed, the approver FAILS LOUD with the exact mismatch
#              (pinned vs catalog-offered csv) instead of silently spinning
#              until the job deadline. A pending upgrade InstallPlan while the
#              pin IS installed is intentionally left unapproved (that is the
#              point of a Manual pin) and the approver exits 0.
#     track  - approve/verify whatever OLM resolved from the channel (the head),
#              regardless of whether it equals `csv`. Use when you want
#              gated-but-current rather than a hard version pin.
#              track also OMITS `startingCSV` from the Subscription, because
#              startingCSV constrains OLM's *resolver*: leaving it set makes the
#              Subscription fail resolution outright (ResolutionFailed -> no
#              InstallPlan -> approver spins to its deadline) whenever the pinned
#              build is absent from this cluster's catalog. That is what makes
#              track the correct choice for operators whose builds are tied to
#              the cluster's OCP minor, since the catalog only carries builds for
#              the running release train. Under track, `csv` is retained purely
#              as documentation of the intended baseline.
#
#   installPlanApproverLookupAttempts: 36   # 5s each ~= 3 min before failing loud
#   installPlanVerifierAttempts: 60         # attempts for the csv/complete verifiers
#   installPlanVerifierSleepSeconds: 5      # sleep between verifier attempts
#
# EXAMPLE: declaratively controlled operator version
operators:
# - channel: stable
#   installPlanApproval: Manual
#   name: external-secrets-operator
#   source: community-operators
#   sourceNamespace: openshift-marketplace
#   csv: external-secrets-operator.v0.8.2
#   pinPolicy: strict
# - channel: gitops-1.10
#   installPlanApproval: Manual
#   name: openshift-gitops-operator
#   source: redhat-operators
#   sourceNamespace: openshift-marketplace
#   csv: openshift-gitops-operator.v1.10.1
#   namespace: openshift-gitops-operator
#   config:
#     env:
#     - name: DISABLE_DEFAULT_ARGOCD_INSTANCE
#       value: "true"

