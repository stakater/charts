{{- $r := .Values.prometheus.rules.shard.errorRateHigh }}
{{- /* Input is a recorded kcp:* series: without recording rules this alert can
       never fire, so the gate requires both toggles (audit finding). */}}
{{- if and ($r) ($r.enabled) (.Values.prometheus.recordingRules.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-shard-error-rate
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.shard
      rules:
        - alert: KcpShardErrorRateHigh
          expr: |
            kcp:shard_error_ratio:rate5m > {{ $r.threshold }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "kcp shard {{`{{ $labels.job }}`}} 5xx ratio is {{`{{ $value | humanizePercentage }}`}}"
            description: "A shard 5xx-ing predicts customer-facing failures for the workspaces it serves."
{{- end }}
