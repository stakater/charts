# Example values for a Stakater Cloud / OpenShift-UWM cluster (modelled on the us-2 deploy validation,
# tests/reports/validation-us-2-2026-06-12.md). Apply with:  helm ... -f values-stakater-cloud-example.yaml
#
# Two values still need confirming against YOUR cluster before the inventory rule is trusted
# (marked CONFIRM below) — use the discovery commands at the bottom.

# The cluster already scrapes core + providers via its own ServiceMonitor/PodMonitor, so the
# chart's monitors stay OFF; the rules just point at the existing Prometheus jobs.
#
# ⚠️ CONFIRM this per cluster — it is NOT true of every Stakater Cloud cluster. Those
# monitors and the `crossplane-metrics` Service they select are hand-applied platform
# objects, not part of any chart, so a cluster can be missing them entirely and every rule
# and panel then evaluates against nothing. Check with:
#   kubectl get servicemonitor,podmonitor -A | grep -i crossplane
#   kubectl get svc -n crossplane-system | grep metrics
# If they are absent, turn the chart's own scrape on instead (see the commented block
# below) rather than hand-applying more unowned objects.
prometheus:
  monitors:
    coreServiceMonitor:
      enabled: false
    providerPodMonitor:
      enabled: false
    # If the cluster has NO crossplane-metrics Service, uncomment these three blocks. The
    # Service is named after `crossplane.core.job` below, so the core rules keep matching,
    # and its default selector `{app: crossplane}` needs no per-cluster value — that label
    # tracks the upstream chart's name, not the release name (which is `crossplane-operator`
    # on us-2 and `crossplane` on eu-2). But DO override `crossplane.providers.job` to
    # `crossplane-system/<release>-crossplane-observability-providers`, because a PodMonitor's
    # job label is `<namespace>/<podmonitor-name>` and will not match the value set below.
    # coreMetricsService:
    #   enabled: true
  rules:
    fleet:
      # On UWM, keep the PrometheusRule composite alerts OFF — Grafana handles them
      # (grafana.compositeAlerts below), because a UWM PrometheusRule is namespace-enforced.
      compositeNotReady:
        enabled: false
      compositeNotSynced:
        enabled: false

crossplane:
  core:
    # Job label the cluster's existing scrape assigns to Crossplane core metrics.
    job: crossplane-metrics
  providers:
    # Job label for the providers+functions scrape.
    job: crossplane-system/crossplane-providers-and-functions

  # Story 4.1 — wire the on-cluster ksm-crossplane exporter for composite (XR) readiness.
  # Confirmed shape on us-2: a one-hot condition metric per XR kind. The default pattern
  # below matches every kube_customresource_crossplane_xr_<kind>_condition family (all XR
  # kinds), so you don't enumerate kinds.
  inventory:
    enabled: true
    conditionMetricPattern: "kube_customresource_crossplane_xr_.+_condition"
    readyType: "Ready"
    syncedType: "Synced"
    # CONFIRM the job label its metrics land under (see discovery below).
    job: ksm-crossplane                                  # CONFIRM

# Grafana: target the cluster's Crossplane Grafana instance.
grafana:
  namespace: crossplane-observability
  # This REPLACES the chart default: grafana.instanceSelector is empty in values and resolves
  # to {app: grafana} in the template, so what you write here is exactly what the CRs select.
  # Give the complete selector — matchLabels is an AND, and one extra key means the CR matches
  # no Grafana and the dashboard is never imported (silently — no Grafana ever saw the CR).
  # Do NOT add `app: null`: there is no default to cancel, and the KubeStack addon pipeline
  # strips nulls with RFC-7386 merge semantics before Helm sees them anyway.
  # Also: spec.instanceSelector is IMMUTABLE — to change it, delete & recreate the GrafanaDashboard.
  instanceSelector:
    matchLabels:
      dashboards: crossplane

  # Story 4.1 composite alerts on UWM: use Grafana-managed alerts (a PrometheusRule is
  # namespace-enforced and would fire 0). REQUIRES the cross-namespace datasource UID, and a
  # Grafana contact point → Alertmanager so they reach on-call (see docs/alerting-architecture.md).
  compositeAlerts:
    enabled: true
    datasourceUid: ""                                    # CONFIRM — thanos-querier datasource UID in Grafana

# Calibration: ReconcileErrorRateHigh already excludes the churny internal controllers
# (usage / clusterusage / *compositeresourcedefinition* / configurationrevision) by default.
# Add cluster-specific noisy controllers here if needed, e.g.:
#   prometheus:
#     rules:
#       controlPlane:
#         reconcileErrorRateHigh:
#           excludeControllers: ".*usage.*|.*compositeresourcedefinition.*|.*configurationrevision.*|.*xproject.*"

# --- Discovery commands to fill in the CONFIRM values ----------------------------------------
# 1. Confirm the exporter's condition metric (and its kind/type labels):
#      kubectl -n <ksm-crossplane-ns> port-forward deploy/ksm-crossplane 8080:8080 &
#      curl -s localhost:8080/metrics | grep -E 'kube_customresource_crossplane_.*condition' | head
#    Confirm the family names match conditionMetricPattern and have type="Ready"/"Synced" labels.
#    If you have more than one XR kind, add a rule/recording per family or widen the match.
# 2. Find the job label it lands under in Prometheus:
#      count by (job)({__name__="<that metric name>"})        # in thanos-querier
#    -> crossplane.inventory.job
# 3. Then verify the chart agrees with reality:
#      ./tests/fetch-cluster-metrics.sh -n <ns>          # also scrape the ksm pod if separate
#      python3 tests/verify-fetched.py --dumps ./fetched-metrics-<ctx>
#    Confirm the claim metric is PRESENT with name+namespace labels before enabling in prod.
