{{- $r := .Values.prometheus.rules.velero.bslUnavailable }}
{{- if and ($r) ($r.enabled) (.Values.stateExporter.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "oadp-observability.fullname" . }}-bsl-unavailable
  namespace: {{ include "oadp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "oadp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: oadp.backup-cause
      rules:
        - alert: OadpBackupStorageLocationUnavailable
          # The CAUSE behind "every run ends FailedValidation": the BSL (bucket) fails
          # Velero's periodic validation, e.g. rejected credentials or a deleted bucket.
          # Velero re-validates every minute, so this names the cause long before any outcome
          # alert can. Phase comes from the chart's state exporter (Velero has no BSL
          # metric). A BSL with no phase yet emits no series (see the watchdog).
          expr: |
            max by (namespace, name) (kube_customresource_backupstoragelocation_status_phase{phase="Available"}) == 0
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: oadp
          annotations:
            summary: "Velero BackupStorageLocation {{`{{ $labels.name }}`}} is not Available"
            description: "Every backup that targets {{`{{ $labels.name }}`}} will end FailedValidation until this is fixed. Usual causes: rejected bucket credentials (e.g. S3 403 AccessDenied), a deleted bucket, or no network path. First: oc -n {{`{{ $labels.namespace }}`}} get backupstoragelocations.velero.io {{`{{ $labels.name }}`}} -o jsonpath='{.status.message}'"
            runbook_url: "{{ .Values.prometheus.rules.runbookBaseURL }}#oadpbackupstoragelocationunavailable"
{{- end }}
