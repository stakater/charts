{{- $r := .Values.prometheus.rules.footprint.podCPUThrottled }}
{{- if and ($r) ($r.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-pod-cpu-throttled
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.footprint
      rules:
        - alert: KcpPodCPUThrottled
          expr: |
            sum by (pod, container) (increase(container_cpu_cfs_throttled_periods_total{namespace="{{ include "kcp-observability.namespace" . }}", pod=~"{{ .Values.kcp.podRegex }}", container!=""}[5m])) / clamp_min(sum by (pod, container) (increase(container_cpu_cfs_periods_total{namespace="{{ include "kcp-observability.namespace" . }}", pod=~"{{ .Values.kcp.podRegex }}", container!=""}[5m])), 1) > {{ $r.threshold }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "kcp pod {{`{{ $labels.pod }}`}} CPU-throttled {{`{{ $value | humanizePercentage }}`}} of periods"
            description: "A throttled apiserver/proxy is a slow one. Raise the CPU limit or reduce load."
{{- end }}
