{{- $r := .Values.prometheus.rules.finops.costJobNeverSucceeded }}
{{- $op := index .Values.mto.operators "finops-operator" }}
{{- if and ($r) ($r.enabled) ($op) ($op.enabled) }}
# The day-one failure MTOCostDataStale cannot see: a CostJob with no success
# timestamp to age. The one-hot status gauge is published all-zero for a
# never-executed job precisely so this is expressible.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "mto-observability.fullname" . }}-finops-cost-job-never-succeeded
  namespace: {{ include "mto-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "mto-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: mto.finops.cost-job-never-succeeded
      rules:
        - alert: MTOCostJobNeverSucceeded
          expr: |
            max by (costjob, namespace, type) (finops_costjob_last_execution_status{job="{{ $op.job }}"}) >= 0
              unless on (costjob, namespace, type)
                finops_costjob_last_successful_execution_timestamp_seconds{job="{{ $op.job }}"}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: mto
          annotations:
            summary: "CostJob {{`{{ $labels.costjob }}`}} has never succeeded"
            description: "CostJob {{`{{ $labels.costjob }}`}} ({{`{{ $labels.type }}`}}, namespace {{`{{ $labels.namespace }}`}}) exists but has never completed a successful collection ({{ $r.for }} grace). Either its CronJob never ran — schedule, suspension, quota, or an unresolvable image such as an unset OPERATOR_IMAGE rendering a placeholder — or every run failed. No cost data has ever landed for it."
{{- end }}
