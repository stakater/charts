{{- range .Values.operators }}
{{- if eq .installPlanApproval "Manual" }}
---
# create one installplan-complete-verifier job per manual operator
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" .csv "csv-verifier" | trunc -63 | trimAll "-" }}
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    {{- include "operators-installer.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    # Unlike the approver/verifier Jobs this one is a NORMAL synced resource, not an
    # Argo hook, so hook-delete-policy does not apply to it — it needs the non-hook
    # equivalent. Its name derives from `csv` and a Job's spec.template is immutable,
    # so once this Job has FAILED, ArgoCD can only try to patch it and the sync dies
    # with
    #   Job.batch "<csv>-csv-verifier" is invalid: spec.template: Invalid value: ...
    # leaving the app Degraded on a stale failure that no longer reflects reality,
    # and unable to re-verify after the underlying problem is fixed. Observed on
    # y0c8muex: a 15h-old failed csv-verifier kept openshift-vertical-pod-autoscaler
    # Degraded even once the operator was installed and Running, and only a manual
    # `oc delete job` cleared it (SA-8641).
    # Force+Replace makes ArgoCD delete and recreate it (kubectl replace --force)
    # instead of patching, which is the only way to roll an immutable Job.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  completions: 1
  parallelism: 1
  backoffLimit: {{ .installPlanVerifierRetries | default 10 }}
  activeDeadlineSeconds: {{ .installPlanVerifierActiveDeadlineSeconds | default 600 }}
  template:
    spec:
      containers:
      - name: csv-installed-verifier
        image: {{ $.Values.installPlanApproverAndVerifyJobsImage }}
        command:
          - /bin/bash
          - -c
          - |
            export HOME=/tmp/approver
            echo

            # ----------------------------------------------------------------
            # Decide WHICH csv to verify.
            #   strict : the pinned csv must be the one that reaches Succeeded.
            #   track  : verify the csv OLM resolved to (status.currentCSV) - the
            #            version being installed now, which may be the channel head
            #            rather than the pin. (Not installedCSV: that is the OLD
            #            version until the upgrade completes and would pass early.)
            # ----------------------------------------------------------------
            verifyCSV="${SUBSCRIPTION_CSV}"
            if [ "${PIN_POLICY}" = "track" ]; then
              verifyCSV=""
              counter=0
              while [ -z "${verifyCSV}" ]; do
                verifyCSV=$(oc get subscriptions.operators.coreos.com -n ${Namespace} ${SUBSCRIPTION} -o=jsonpath="{.status.currentCSV}")
                if [ -n "${verifyCSV}" ]; then break; fi
                counter=$((counter+1))
                if [ "${counter}" -ge "${MAX_ATTEMPTS}" ]; then
                  echo "Giving up: Subscription ${SUBSCRIPTION} never reported a currentCSV. Operator installation failed."
                  exit 3
                fi
                echo "Waiting for Subscription ${SUBSCRIPTION} to resolve currentCSV... (${counter}/${MAX_ATTEMPTS})"
                sleep "${SLEEP_TIMER}"
              done
            fi
            echo "Verifying ClusterServiceVersion ${verifyCSV} in namespace ${Namespace}"

            # Wait for the CSV to reach Succeeded (bounded).
            counter=0
            get_status=""
            until [ "${get_status}" = "Succeeded" ]; do
              get_status=$(oc get clusterserviceversion -n ${Namespace} ${verifyCSV} -o jsonpath="{.status.phase}" 2>/dev/null)
              if [ "${get_status}" = "Succeeded" ]; then break; fi
              counter=$((counter+1))
              if [ "${counter}" -ge "${MAX_ATTEMPTS}" ]; then
                echo "Giving up. CSV ${verifyCSV} did not reach Succeeded (last phase: '${get_status}'). Operator installation failed."
                exit 3
              fi
              echo "CSV ${verifyCSV} phase: '${get_status}' (attempt ${counter}/${MAX_ATTEMPTS})"
              sleep "${SLEEP_TIMER}"
            done

            echo "CSV ${verifyCSV} reached Succeeded."
            oc get clusterserviceversion -n ${Namespace} ${verifyCSV}
        imagePullPolicy: Always
        env:
        - name: SUBSCRIPTION_CSV
          value: {{ .csv | quote }}
        - name: SUBSCRIPTION
          value: {{ .name | quote }}
        - name: Namespace
          value: {{ .namespace | default $.Release.Namespace | quote }}
        - name: PIN_POLICY
          value: {{ .pinPolicy | default "strict" | quote }}
        - name: MAX_ATTEMPTS
          value: {{ .installPlanVerifierAttempts | default 60 | quote }}
        - name: SLEEP_TIMER
          value: {{ .installPlanVerifierSleepSeconds | default 5 | quote }}
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      serviceAccount: {{ include "operators-installer.approverName" . }}
      serviceAccountName: {{ include "operators-installer.approverName" . }}
      terminationGracePeriodSeconds: 30
{{- end }}
{{- end }}
