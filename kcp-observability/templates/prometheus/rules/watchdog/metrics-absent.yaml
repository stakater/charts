{{- $r := .Values.prometheus.rules.watchdog.metricsAbsent }}
{{- $m := .Values.prometheus.monitors }}
{{- if and ($r) ($r.enabled) }}
# The blindness watchdog: every *Down alert is `up == 0`, which only fires while
# targets EXIST and fail. When targets VANISH (ServiceMonitor deleted, label-selector
# drift, relabel bug, cert rot) `up == 0` matches nothing and the platform looks green
# because nothing is measured — this happened live on us-2 twice (20 syncagent targets
# silently dropped by a PodMonitor port bug; a preempted Failed pod producing no target).
# One absent(up) alert per ENABLED monitor, so a deliberately disabled monitor never
# fires it. The `target` label names the blind layer for routing/summary (absent()
# emits no labels from regex matchers).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-metrics-absent
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.watchdog
      rules:
        {{- $targets := list }}
        {{- if and $m.shardServiceMonitor $m.shardServiceMonitor.enabled }}
        {{- $targets = append $targets (dict "target" "shard" "job" .Values.kcp.shards.job) }}
        {{- end }}
        {{- if and $m.frontProxyServiceMonitor $m.frontProxyServiceMonitor.enabled }}
        {{- $targets = append $targets (dict "target" "front-proxy" "job" .Values.kcp.frontProxy.job) }}
        {{- end }}
        {{- if and $m.etcdServiceMonitor $m.etcdServiceMonitor.enabled }}
        {{- $targets = append $targets (dict "target" "etcd" "job" .Values.kcp.etcd.job) }}
        {{- end }}
        {{- if and $m.syncAgentPodMonitor $m.syncAgentPodMonitor.enabled }}
        {{- $targets = append $targets (dict "target" "syncagent" "job" .Values.kcp.syncAgent.job) }}
        {{- end }}
        {{- range $t := $targets }}
        - alert: KcpMetricsAbsent
          expr: |
            absent(up{job=~"{{ $t.job }}"})
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
            target: {{ $t.target }}
          annotations:
            summary: "Monitoring is blind: no {{ $t.target }} scrape targets exist"
            description: "up{job=~\"{{ $t.job }}\"} has NO series — the targets have vanished (monitor deleted, label-selector drift, relabel bug, or cert rot), which no up==0 alert can catch. Every {{ $t.target }} alert is silently disarmed until this is fixed; the platform may look green because nothing is measured."
        {{- end }}
{{- end }}
