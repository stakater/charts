{{- $r := .Values.prometheus.rules.frontProxy.latencyHigh }}
{{- /* Input is a recorded kcp:* series: without recording rules this alert can
       never fire, so the gate requires both toggles (audit finding). */}}
{{- if and ($r) ($r.enabled) (.Values.prometheus.recordingRules.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-front-proxy-latency
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.front_proxy
      rules:
        - alert: KcpFrontProxyLatencyHigh
          {{- /* Ratio of slow requests WITHIN the non-watch population, not a p95 in
                 seconds. proxy_request_duration_seconds mixes long-running watches in
                 and offers no label to exclude them, so a seconds threshold on its p95
                 is unusable: above a ~5% watch share the quantile pins to the top
                 finite bucket permanently (eu-3: 7.6% watches -> constant 60). See
                 values.yaml and docs/alerts-guide.md. */}}
          expr: |
            kcp:front_proxy_slow_ratio:rate5m > {{ $r.threshold }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "{{`{{ $value | humanizePercentage }}`}} of kcp edge requests are slower than {{ .Values.kcp.frontProxy.latencyBudgetBucket }}s (watches excluded)"
            description: "Sustained high latency at the front-proxy degrades every tenant interaction with the control plane."
{{- end }}
