{{- if and (.Values.prometheus.monitors.management) (.Values.prometheus.monitors.management.enabled) }}
{{- $m := .Values.prometheus.monitors.management }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "netbird-observability.fullname" . }}-management
  namespace: {{ include "netbird-observability.namespace" . }}
  labels:
    {{- include "netbird-observability.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: management-metrics
  namespaceSelector:
    matchNames:
      - {{ include "netbird-observability.namespace" . }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $m.interval }}
      scrapeTimeout: {{ $m.scrapeTimeout }}
{{- end }}
