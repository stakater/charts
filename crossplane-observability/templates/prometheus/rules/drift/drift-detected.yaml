{{- $r := .Values.prometheus.rules.drift.driftDetected }}
{{- if and $r $r.enabled }}
# Story 3.1 — a managed resource has drifted out of sync with its desired state. Silent
# drift means configuration we believe is enforced actually is not (correctness signal).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crossplane-drift-detected
  namespace: {{ include "crossplane-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "crossplane-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: crossplane.drift
      rules:
        - alert: DriftDetected
          # crossplane_managed_resource_drift_seconds is a HISTOGRAM, not the per-GVK gauge
          # this rule originally assumed (confirmed on a live build: only _bucket/_sum/_count
          # exist, labelled gvk + crossplane_provider/crossplane_revision). The bare metric
          # name matches nothing, so the gauge form could never fire.
          #
          # Quantiles are unusable on this histogram: upstream bucket boundaries stop at
          # le=10.0 while real observations are minutes, so ~all of them land in +Inf and
          # histogram_quantile returns a flat 10 for every kind with traffic. The mean —
          # rate(_sum)/rate(_count) — is the only faithful reading of the real duration.
          #
          # 1h window: drift observations are sparse per gvk (tens per day on some kinds),
          # so a short window leaves most kinds with no samples and the alert blind.
          expr: |
            sum by (gvk) (rate(crossplane_managed_resource_drift_seconds_sum{job="{{ .Values.crossplane.providers.job }}"}[1h]))
              /
            sum by (gvk) (rate(crossplane_managed_resource_drift_seconds_count{job="{{ .Values.crossplane.providers.job }}"}[1h]))
              > {{ $r.thresholdSeconds }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: crossplane
          annotations:
            summary: "Drift detected for {{`{{ $labels.gvk }}`}}"
            description: "Managed resources of {{`{{ $labels.gvk }}`}} are spending {{`{{ $value | humanizeDuration }}`}} out of sync with desired state on average, above the {{ $r.thresholdSeconds }}s threshold, for more than {{ $r.for }}."
{{- end }}
