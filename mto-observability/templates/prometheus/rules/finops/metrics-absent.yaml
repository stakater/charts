{{- $r := .Values.prometheus.rules.finops.metricsAbsent }}
{{- $op := index .Values.mto.operators "finops-operator" }}
{{- $m := .Values.prometheus.monitors.podMonitors }}
{{- /* Needs the chart's monitors: without the scrape no series ever exists and
absent() would fire forever. */}}
{{- if and ($r) ($r.enabled) ($op) ($op.enabled) ($m) ($m.enabled) }}
# The watchdog that keeps the three cost-pipeline alerts honest: without the
# scrape they silently stop evaluating.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "mto-observability.fullname" . }}-finops-metrics-absent
  namespace: {{ include "mto-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "mto-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: mto.finops.metrics-absent
      rules:
        - alert: MTOFinopsMetricsAbsent
          expr: |
            absent(finops_costjob_last_execution_status{job="{{ $op.job }}"})
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: mto
          annotations:
            summary: "Finops CostJob metrics are absent"
            description: "No finops_costjob series are being scraped: the finops-operator is down, the scrape is broken, the running version predates the gauges, or no CostJob exists on this cluster. While this fires, the cost-pipeline alerts (MTOCostDataStale and friends) are blind. If no CostJob is expected here, disable this alert."
{{- end }}
