clusterBackup:
  enabled: true
  # This Policy is set to Delete when you want the Bucket CR to wait for the contents in S3 to delete. It is set to Orphan when you want to delete the Bucket CR and leave the data in S3.
  deletionPolicy: "Orphan" # Option for Delete or Orphan
  # This option if set to true ensure that when the bucket CR deletes, it will delete the bucket in S3 as well despite it having data in it or not.
  forceDestroy: false
  awsBucketName: organization-clustername-cluster-backup
  bucketType: s3
  crossplaneNamespace: crossplane-system
  schedule: "@hourly"
  ttl: "48h0m0s"
externalSecrets:
  enabled: true
pushSecret:
  enabled: true
developmentMode:
  enabled: false
  aws_secret_access_key_encoded: WFhYWFg= # XXXXX
backupSchedule:
  includedNamespaces:
    - "*"
  excludedResources:
    - imagetags
    - images
    - templateinstances
    - clusterserviceversions
    - packagemanifests
    - servicebrokers
    - servicebindings
    - serviceclasses
    - serviceinstances
    - serviceplans
    - events
    - secrets
backupLocations:
  - velero:
      provider: aws
      default: true
      objectStorage:
        bucket: organization-clustername-cluster-backup
        prefix: dpa/
      config:
        region: us-west-2
        s3Url: https://s3.us-west-2.amazonaws.com/
        profile: default
      credential:
        name: organization-clustername-cluster-backup
        key: cloud

snapshotLocations:
  - velero:
      config:
        profile: volumeSnapshot
        region: eu-north-1
      credential:
        key: cloud
        name: organization-clustername-cluster-backup
      provider: aws

configuration:
  velero:
    # Run Velero with no backup storage location (DPA spec.configuration.velero.
    # noDefaultBackupLocation), e.g. on a cluster with nowhere to store Velero backups.
    # Set it together with `backupLocations: []`: the DPA is rendered without one and the
    # default-object-schedule Schedule is not rendered at all. The operator and its plugins
    # (kubevirt, csi, ...) stay installed for anything that brings its own location.
    noDefaultBackupLocation: false
    podConfig:
      resourceAllocations:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 1Gi
  nodeAgent:
    podConfig:
      resourceAllocations:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 1Gi
