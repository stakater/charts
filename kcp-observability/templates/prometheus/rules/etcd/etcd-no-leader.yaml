{{- $r := .Values.prometheus.rules.etcd.noLeader }}
{{- if and ($r) ($r.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-etcd-no-leader
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.etcd
      rules:
        - alert: KcpEtcdNoLeader
          # container="etcd" is load-bearing: the etcd-backup-restore sidecar exports
          # its own etcd_server_has_leader that is permanently 0 (seen live on us-2 —
          # all members "leaderless" while etcd was healthy).
          expr: |
            etcd_server_has_leader{job=~"{{ .Values.kcp.etcd.job }}", container="etcd"} == 0
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "kcp etcd member {{`{{ $labels.pod }}`}} has no leader"
            description: "etcd without a leader means the kcp control plane cannot write — a hard outage. Check quorum (2/3 members must be healthy)."
{{- end }}
