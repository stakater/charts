{{- $r := .Values.prometheus.rules.etcd.dbSizeHigh }}
{{- /* Input is a recorded kcp:* series: without recording rules this alert can
       never fire, so the gate requires both toggles (audit finding). */}}
{{- if and ($r) ($r.enabled) (.Values.prometheus.recordingRules.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-etcd-db-size
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.etcd
      rules:
        - alert: KcpEtcdDBSizeHigh
          expr: |
            kcp:etcd_db_used_ratio > {{ $r.threshold }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "kcp etcd DB at {{`{{ $value | humanizePercentage }}`}} of quota"
            description: "Approaching the backend quota. At 100% etcd goes into a read-only alarm — a self-inflicted total outage. Consider compaction/defrag or a larger quota."
{{- end }}
