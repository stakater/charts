{{- $r := .Values.prometheus.rules.etcd.backupStale }}
{{- if and ($r) ($r.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-etcd-backup-stale
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.etcd
      rules:
        - alert: KcpEtcdBackupStale
          # max across members is load-bearing: only the currently-snapshotting
          # member's sidecar has fresh timestamps — the others report their own
          # last-leadership times (seen live on us-2: cluster snapshot 5min old,
          # two members "stale" by days).
          expr: |
            (time() - max by (kind, job, namespace) (etcdbr_snapshot_latest_timestamp{kind="Full"}) > {{ $r.fullMaxAgeHours }} * 3600) or (time() - max by (kind, job, namespace) (etcdbr_snapshot_latest_timestamp{kind="Incr"}) > {{ $r.incrMaxAgeMinutes }} * 60)
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "kcp etcd backups are stale ({{`{{ $labels.kind }}`}} snapshot too old)"
            description: "A control plane without a recent backup is one incident away from unrecoverable. Check the etcd-backup-restore sidecar and the backup bucket."
{{- end }}
