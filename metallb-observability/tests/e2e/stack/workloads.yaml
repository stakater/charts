# Sample workload + one LoadBalancer Service per announcement mode, so the
# allocator has allocations and the speakers have something to announce.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: echo-bgp
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: echo-l2
  namespace: default
  annotations:
    # both spellings: metallb.io is current, metallb.universe.tf the legacy alias
    metallb.io/address-pool: l2-pool
    metallb.universe.tf/address-pool: l2-pool
spec:
  type: LoadBalancer
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 80
