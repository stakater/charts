{{- $r := .Values.prometheus.rules.controllers.queueBacklog }}
{{- if and ($r) ($r.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-controller-queue-backlog
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.controllers
      rules:
        - alert: KcpControllerQueueBacklog
          # min across replicas is load-bearing: the non-leader replica never runs
          # workers, so its queues grow unboundedly (seen live on us-2 — follower at
          # 202 while the leader sat at 0). The min is the leader's actively-drained
          # depth. Known blind spot: a backlogged leader is masked while a replica
          # restarts (its fresh queues read ~0) — accepted over a permanent false page.
          expr: |
            min by (name, job, namespace) (workqueue_depth{job=~"{{ .Values.kcp.shards.job }}", name=~"kcp-.*"}) > {{ $r.depth }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "kcp controller {{`{{ $labels.name }}`}} queue depth at {{`{{ $value }}`}}"
            description: "A growing kcp controller workqueue is the earliest sign workspace/binding reconciliation is falling behind."
{{- end }}
