{{- if .Values.stateExporter.enabled }}
# Read-only. KSM custom-resource-state needs list/watch on CRDs (KSM docs, "RBAC-enabled
# Clusters") plus the resources themselves. Cluster-scoped so the CRS informer works whether
# or not --namespaces applies to it; BSLs and Schedules live in openshift-adp anyway.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oadp-observability.fullname" . }}-state-exporter
  namespace: {{ include "oadp-observability.namespace" . }}
  labels:
    {{- include "oadp-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: state-exporter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oadp-observability.fullname" . }}-state-exporter
  labels:
    {{- include "oadp-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: state-exporter
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch"]
  - apiGroups: ["velero.io"]
    resources: ["backupstoragelocations", "schedules"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oadp-observability.fullname" . }}-state-exporter
  labels:
    {{- include "oadp-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: state-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "oadp-observability.fullname" . }}-state-exporter
subjects:
  - kind: ServiceAccount
    name: {{ include "oadp-observability.fullname" . }}-state-exporter
    namespace: {{ include "oadp-observability.namespace" . }}
{{- end }}
