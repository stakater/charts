{{- $r := .Values.prometheus.rules.workspaces.stuck }}
{{- if and ($r) ($r.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kcp-observability.fullname" . }}-workspaces-stuck
  namespace: {{ include "kcp-observability.namespace" . }}
  labels:
    role: alert-rules
    {{- include "kcp-observability.labels" . | nindent 4 }}
    {{- with .Values.prometheus.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kcp.workspaces
      rules:
        - alert: KcpWorkspacesStuck
          expr: |
            kcp:workspaces_not_ready:count > {{ $r.baseline }}
          for: {{ $r.for }}
          labels:
            severity: {{ $r.severity }}
            rulesgroup: kcp
          annotations:
            summary: "{{`{{ $value }}`}} kcp workspaces/logical clusters are not Ready on shard {{`{{ $labels.shard }}`}}"
            description: "Workspaces sitting in Scheduling/Initializing/Unavailable beyond the baseline are tenants who cannot work. Baseline is calibrated per cluster (us-2 runs a standing Scheduling count)."
{{- end }}
